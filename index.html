<!DOCTYPE html>
<html lang="en-US" data-theme="black" data-locale="en-US" style="--locale: 'en-US';" class="h-full antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GradeCraft — Class Grade Calculator & Forecaster</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>

  <style>
    /* =========================================================================
       THEME DESIGN TOKENS: Black (OLED - Default), Midnight, and Light
       ========================================================================= */
    :root,
    html[data-theme="black"] {
      color-scheme: dark;
      --locale: 'en-US';
      --bg-canvas: #000000;
      --bg-header: rgba(9, 9, 11, 0.92);
      --bg-surface: #09090b;
      --bg-surface-alt: #0f0f13;
      --bg-surface-hover: #14141a;
      --bg-input: #050507;
      --bg-pill: #141419;
      --border-primary: #1e1e24;
      --border-subtle: #15151b;
      --border-input: #272730;
      --text-primary: #fafafa;
      --text-secondary: #d4d4d8;
      --text-muted: #a1a1aa;
      --text-faint: #71717a;
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft-bg: rgba(99, 102, 241, 0.14);
      --accent-soft-text: #a5b4fc;
      --accent-soft-border: rgba(99, 102, 241, 0.32);
      --card-shadow: 0 8px 28px -4px rgba(0, 0, 0, 0.85), inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
      --ambient-glow: radial-gradient(ellipse 80% 35% at 50% -8%, rgba(99, 102, 241, 0.14), transparent);
      --scroll-track: #050507;
      --scroll-thumb: #27272a;
      --scroll-thumb-hover: #3f3f46;
    }

    html[data-theme="midnight"] {
      color-scheme: dark;
      --bg-canvas: #090d16;
      --bg-header: rgba(15, 23, 42, 0.92);
      --bg-surface: #111827;
      --bg-surface-alt: #0f172a;
      --bg-surface-hover: #172033;
      --bg-input: #0b1120;
      --bg-pill: #1e293b;
      --border-primary: #1f2937;
      --border-subtle: #182234;
      --border-input: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #e2e8f0;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --accent-primary: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft-bg: rgba(99, 102, 241, 0.16);
      --accent-soft-text: #a5b4fc;
      --accent-soft-border: rgba(99, 102, 241, 0.35);
      --card-shadow: 0 6px 24px -4px rgba(0, 0, 0, 0.55), inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
      --ambient-glow: radial-gradient(ellipse 80% 35% at 50% -8%, rgba(99, 102, 241, 0.16), transparent);
      --scroll-track: #090d16;
      --scroll-thumb: #334155;
      --scroll-thumb-hover: #475569;
    }

    html[data-theme="light"] {
      color-scheme: light;
      --bg-canvas: #f8fafc;
      --bg-header: rgba(255, 255, 255, 0.94);
      --bg-surface: #ffffff;
      --bg-surface-alt: #f8fafc;
      --bg-surface-hover: #f1f5f9;
      --bg-input: #ffffff;
      --bg-pill: #f1f5f9;
      --border-primary: #e2e8f0;
      --border-subtle: #f1f5f9;
      --border-input: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --accent-primary: #4f46e5;
      --accent-hover: #4338ca;
      --accent-soft-bg: #eef2ff;
      --accent-soft-text: #4338ca;
      --accent-soft-border: #c7d2fe;
      --card-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.06), 0 1px 2px -1px rgba(15, 23, 42, 0.04);
      --ambient-glow: none;
      --scroll-track: #f1f5f9;
      --scroll-thumb: #cbd5e1;
      --scroll-thumb-hover: #94a3b8;
    }

    /* =========================================================================
       SEMANTIC THEME CLASSES
       ========================================================================= */
    body {
      background-color: var(--bg-canvas);
      background-image: var(--ambient-glow);
      background-attachment: fixed;
      color: var(--text-primary);
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-header {
      background-color: var(--bg-header);
      border-color: var(--border-primary);
    }

    .surface-card {
      background-color: var(--bg-surface);
      border-color: var(--border-primary);
      box-shadow: var(--card-shadow);
    }

    .surface-alt {
      background-color: var(--bg-surface-alt);
      border-color: var(--border-primary);
    }

    .surface-pill {
      background-color: var(--bg-pill);
      border-color: var(--border-primary);
    }

    .border-theme {
      border-color: var(--border-primary);
    }

    .border-theme-subtle {
      border-color: var(--border-subtle);
    }

    .text-theme-primary {
      color: var(--text-primary);
    }

    .text-theme-secondary {
      color: var(--text-secondary);
    }

    .text-theme-muted {
      color: var(--text-muted);
    }

    .text-theme-faint {
      color: var(--text-faint);
    }

    .accent-pill {
      background-color: var(--accent-soft-bg);
      color: var(--accent-soft-text);
      border-color: var(--accent-soft-border);
    }

    .theme-input,
    .theme-select {
      background-color: var(--bg-input);
      border: 1px solid var(--border-input);
      color: var(--text-primary);
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
    }

    .theme-input:focus,
    .theme-select:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.24);
    }

    .theme-input::placeholder {
      color: var(--text-faint);
      opacity: 0.85;
    }

    .theme-inline-input {
      background-color: transparent;
      border: 1px solid transparent;
      color: var(--text-primary);
      transition: border-color 0.15s ease, background-color 0.15s ease;
    }

    .theme-inline-input:hover {
      border-color: var(--border-input);
    }

    .theme-inline-input:focus {
      outline: none;
      background-color: var(--bg-input);
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.22);
    }

    .theme-row-hover:hover {
      background-color: var(--bg-surface-hover);
    }

    .theme-btn-secondary {
      background-color: var(--bg-pill);
      border: 1px solid var(--border-primary);
      color: var(--text-secondary);
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }

    .theme-btn-secondary:hover {
      background-color: var(--bg-surface-hover);
      color: var(--text-primary);
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--scroll-track);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scroll-thumb-hover);
    }

    /* Subtle pulse highlight when an assignment moves groups */
    .row-highlight-anim {
      animation: pulseHighlight 1.15s ease-out;
    }
    @keyframes pulseHighlight {
      0% { background-color: rgba(99, 102, 241, 0.25); }
      100% { background-color: transparent; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-indigo-500/30 selection:text-indigo-200">

  <!-- =========================================================================
       TOP HEADER BAR
       ========================================================================= -->
  <header class="sticky top-0 z-30 app-header backdrop-blur-md border-b">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex flex-wrap items-center justify-between py-3 gap-3">
        <!-- Top-Left Brand Reload Button (#btnBrandReload) -->
        <button
          id="btnBrandReload"
          type="button"
          title="Reload GradeCraft"
          aria-label="Reload GradeCraft"
          class="group flex items-center gap-3 text-left cursor-pointer rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-400 transition-transform duration-150 hover:scale-[1.02] active:scale-95"
        >
          <span class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-700 flex items-center justify-center text-white shadow-md shadow-indigo-500/25 ring-1 ring-white/15 group-hover:shadow-lg group-hover:shadow-indigo-500/40 transition-all">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
          </span>
          <div>
            <div class="flex items-center gap-2">
              <span class="text-lg font-extrabold tracking-tight text-theme-primary">GradeCraft</span>
              <span class="hidden sm:inline-block text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full accent-pill border">
                UC Berkeley Scale
              </span>
            </div>
            <p class="text-xs text-theme-muted">Class Grade Calculator &amp; Forecaster</p>
          </div>
        </button>

        <!-- Right Navigation Switcher Pills -->
        <nav aria-label="Primary Workspace Navigation" class="flex items-center gap-1.5 p-1 rounded-2xl surface-pill border">
          <button
            id="navGradebookBtn"
            type="button"
            data-nav-view="gradebook"
            class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold transition cursor-pointer"
          >
            <i class="fa-solid fa-table-columns"></i>
            <span>Gradebook</span>
          </button>
          <button
            id="navProfileBtn"
            type="button"
            data-nav-view="profile"
            class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold transition cursor-pointer"
          >
            <span id="headerAvatarInitials" class="w-5 h-5 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px] font-bold">SN</span>
            <span>Profile &amp; Settings</span>
          </button>
        </nav>
      </div>
    </div>
  </header>

  <!-- =========================================================================
       MAIN WORKSPACE CONTAINER
       ========================================================================= -->
  <main id="mainWorkspace" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- Dynamically rendered by JavaScript -->
  </main>

  <!-- =========================================================================
       FOOTER
       ========================================================================= -->
  <footer class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-xs text-theme-faint border-t border-theme mt-10">
    <p>GradeCraft — Class Grade Calculator &amp; Forecaster. All course configurations, grade definitions, and assignment forecasts are saved locally in your browser.</p>
  </footer>

  <!-- =========================================================================
       CUSTOM CONFIRMATION MODAL (No browser alert/confirm)
       ========================================================================= -->
  <div id="confirmModalBackdrop" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="surface-card rounded-2xl border max-w-md w-full p-6 space-y-4">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-500/15 text-rose-400 border border-rose-500/30 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-triangle-exclamation text-lg"></i>
        </div>
        <div>
          <h3 id="confirmModalTitle" class="text-base font-bold text-theme-primary">Confirm Action</h3>
          <p id="confirmModalMessage" class="text-xs text-theme-muted mt-1 leading-relaxed">Are you sure you want to proceed?</p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <button id="confirmModalCancelBtn" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold theme-btn-secondary cursor-pointer">
          Cancel
        </button>
        <button id="confirmModalAcceptBtn" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-sm transition cursor-pointer">
          Confirm
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Stack -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- =========================================================================
       MODULAR ES6+ APPLICATION LOGIC
       ========================================================================= -->
  <script>
    (() => {
      'use strict';

      /*************************************************************************
       * 1. CONSTANTS & UC BERKELEY REGISTRAR GRADE DEFINITIONS
       *************************************************************************/
      const STORAGE_KEY = 'gradecraft_app_state_v4';

      const UC_BERKELEY_GRADE_DEFINITIONS = [
        { id: 'grade_ap', letter: 'A+', min: 97, gpa: 4.0, description: 'Remarkable / Extraordinary Achievement' },
        { id: 'grade_a',  letter: 'A',  min: 93, gpa: 4.0, description: 'Excellent' },
        { id: 'grade_am', letter: 'A-', min: 90, gpa: 3.7, description: 'Excellent' },
        { id: 'grade_bp', letter: 'B+', min: 87, gpa: 3.3, description: 'Good' },
        { id: 'grade_b',  letter: 'B',  min: 83, gpa: 3.0, description: 'Good' },
        { id: 'grade_bm', letter: 'B-', min: 80, gpa: 2.7, description: 'Good' },
        { id: 'grade_cp', letter: 'C+', min: 77, gpa: 2.3, description: 'Fair' },
        { id: 'grade_c',  letter: 'C',  min: 73, gpa: 2.0, description: 'Fair' },
        { id: 'grade_cm', letter: 'C-', min: 70, gpa: 1.7, description: 'Fair' },
        { id: 'grade_dp', letter: 'D+', min: 67, gpa: 1.3, description: 'Barely Passing' },
        { id: 'grade_d',  letter: 'D',  min: 63, gpa: 1.0, description: 'Barely Passing' },
        { id: 'grade_dm', letter: 'D-', min: 60, gpa: 0.7, description: 'Barely Passing' },
        { id: 'grade_f',  letter: 'F',  min: 0,  gpa: 0.0, description: 'Failing' }
      ];

      const SUPPORTED_LOCALES = [
        { code: 'en-US', label: 'English (United States) — en-US' },
        { code: 'es-ES', label: 'Español (España) — es-ES' },
        { code: 'fr-FR', label: 'Français (France) — fr-FR' },
        { code: 'de-DE', label: 'Deutsch (Deutschland) — de-DE' },
        { code: 'uk-UA', label: 'Українська (Україна) — uk-UA' },
        { code: 'zh-CN', label: '中文 (简体) — zh-CN' },
        { code: 'ja-JP', label: '日本語 (日本) — ja-JP' },
        { code: 'ko-KR', label: '한국어 (대한민국) — ko-KR' }
      ];

      const GROUP_DOT_COLORS = [
        'bg-indigo-500',
        'bg-emerald-500',
        'bg-amber-500',
        'bg-violet-500',
        'bg-sky-500',
        'bg-rose-500',
        'bg-teal-500'
      ];

      function uid(prefix = 'id') {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
      }

      function cloneGradeScale(scale) {
        const src = Array.isArray(scale) && scale.length > 0 ? scale : UC_BERKELEY_GRADE_DEFINITIONS;
        return src.map((item, idx) => ({
          id: item.id || uid(`b_${idx}`),
          letter: String(item.letter || 'F'),
          min: Number(item.min ?? 0),
          gpa: item.gpa !== undefined && item.gpa !== null ? Number(item.gpa) : null,
          description: String(item.description || '')
        }));
      }

      /*************************************************************************
       * 2. DEFAULT ANONYMOUS FILLER STATE
       *************************************************************************/
      function createDefaultState() {
        const defaultScale = cloneGradeScale(UC_BERKELEY_GRADE_DEFINITIONS);
        return {
          activeView: 'gradebook', // 'gradebook' | 'profile'
          activeClassId: 'class_cs101',
          gradebookViewMode: 'grouped', // 'grouped' | 'unified'
          theme: 'black', // 'black' | 'midnight' | 'light'
          locale: 'en-US',
          profile: {
            displayName: 'Student Name',
            email: 'student@university.edu',
            institution: 'University Name',
            studentId: 'ID-00000000'
          },
          defaultGradeDefinitions: cloneGradeScale(defaultScale),
          classes: [
            {
              id: 'class_cs101',
              code: 'CS 101',
              name: 'Computer Science 101',
              term: 'Term 1',
              targetLetter: 'A',
              groups: [
                { id: 'grp_cs_asg', name: 'Assignments', weight: 30 },
                { id: 'grp_cs_mt', name: 'Midterm Exam', weight: 30 },
                { id: 'grp_cs_fin', name: 'Final Exam', weight: 40 }
              ],
              buckets: cloneGradeScale(defaultScale),
              assignments: [
                { id: 'asg_cs_1', name: 'Assignment 1', groupId: 'grp_cs_asg', earned: 45, available: 50, whatIfEarned: null },
                { id: 'asg_cs_2', name: 'Assignment 2', groupId: 'grp_cs_asg', earned: null, available: 50, whatIfEarned: null },
                { id: 'asg_cs_3', name: 'Midterm Exam', groupId: 'grp_cs_mt', earned: null, available: 100, whatIfEarned: null },
                { id: 'asg_cs_4', name: 'Final Exam', groupId: 'grp_cs_fin', earned: null, available: 150, whatIfEarned: null }
              ]
            },
            {
              id: 'class_ds100',
              code: 'DATA 100',
              name: 'Data Science 100',
              term: 'Term 1',
              targetLetter: 'A',
              groups: [
                { id: 'grp_ds_hw', name: 'Assignments', weight: 25 },
                { id: 'grp_ds_lab', name: 'Labs', weight: 15 },
                { id: 'grp_ds_mt', name: 'Midterm Exam', weight: 25 },
                { id: 'grp_ds_fin', name: 'Final Exam', weight: 35 }
              ],
              buckets: cloneGradeScale(defaultScale),
              assignments: [
                { id: 'asg_ds_1', name: 'Assignment 1', groupId: 'grp_ds_hw', earned: 48, available: 50, whatIfEarned: null },
                { id: 'asg_ds_2', name: 'Lab 1', groupId: 'grp_ds_lab', earned: 20, available: 20, whatIfEarned: null },
                { id: 'asg_ds_3', name: 'Midterm Exam', groupId: 'grp_ds_mt', earned: 88, available: 100, whatIfEarned: null },
                { id: 'asg_ds_4', name: 'Final Exam', groupId: 'grp_ds_fin', earned: null, available: 150, whatIfEarned: null }
              ]
            }
          ]
        };
      }

      /*************************************************************************
       * 3. STATE PERSISTENCE, THEME & LOCALE CASCADE
       *************************************************************************/
      let state = loadState();
      let highlightedAssignmentId = null;

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createDefaultState();
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.classes) || parsed.classes.length === 0) {
            return createDefaultState();
          }
          if (!['black', 'midnight', 'light'].includes(parsed.theme)) parsed.theme = 'black';
          if (!parsed.locale) parsed.locale = 'en-US';
          if (!parsed.profile) {
            parsed.profile = {
              displayName: 'Student Name',
              email: 'student@university.edu',
              institution: 'University Name',
              studentId: 'ID-00000000'
            };
          }
          if (!Array.isArray(parsed.defaultGradeDefinitions) || parsed.defaultGradeDefinitions.length === 0) {
            parsed.defaultGradeDefinitions = cloneGradeScale(UC_BERKELEY_GRADE_DEFINITIONS);
          }
          return parsed;
        } catch (err) {
          console.error('Error reading localStorage state:', err);
          return createDefaultState();
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (err) {
          console.error('Error saving localStorage state:', err);
        }
      }

      function applyTheme(theme) {
        const valid = ['black', 'midnight', 'light'];
        const chosen = valid.includes(theme) ? theme : 'black';
        state.theme = chosen;
        document.documentElement.setAttribute('data-theme', chosen);
      }

      function applyLocale(localeCode) {
        const chosen = localeCode || 'en-US';
        state.locale = chosen;
        document.documentElement.lang = chosen;
        document.documentElement.setAttribute('data-locale', chosen);
        document.documentElement.style.setProperty('--locale', `'${chosen}'`);
        if (document.body) {
          document.body.setAttribute('data-locale', chosen);
        }
      }

      function getActiveClass() {
        let cls = state.classes.find(c => c.id === state.activeClassId);
        if (!cls && state.classes.length > 0) {
          state.activeClassId = state.classes[0].id;
          cls = state.classes[0];
        }
        return cls;
      }

      /*************************************************************************
       * 4. LOCALE-AWARE NUMBER FORMATTING & UI HELPERS
       *************************************************************************/
      function formatNumber(value, minDecimals = 0, maxDecimals = 2) {
        if (value === null || value === undefined || isNaN(Number(value))) return '--';
        try {
          return new Intl.NumberFormat(state.locale || 'en-US', {
            minimumFractionDigits: minDecimals,
            maximumFractionDigits: maxDecimals
          }).format(Number(value));
        } catch {
          return Number(value).toFixed(maxDecimals);
        }
      }

      function formatPercent(value, decimals = 2) {
        if (value === null || value === undefined || isNaN(Number(value))) return '--%';
        return `${formatNumber(value, decimals, decimals)}%`;
      }

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getInitials(name) {
        const clean = String(name || '').trim();
        if (!clean) return 'SN';
        const parts = clean.split(/\s+/).filter(Boolean);
        if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
        return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      }

      function isGradedValue(val) {
        return val !== null && val !== undefined && val !== '' && !isNaN(Number(val));
      }

      function getLetterBadgeClasses(letter) {
        const isLight = state.theme === 'light';
        if (!letter || letter === '--') {
          return isLight
            ? 'bg-slate-100 text-slate-500 border-slate-200'
            : 'bg-zinc-900 text-zinc-500 border-zinc-800';
        }
        const upper = letter.toUpperCase();
        if (upper.startsWith('A')) {
          return isLight
            ? 'bg-emerald-50 text-emerald-700 border-emerald-200'

        }

            ? 'bg-orange-50 text-orange-700 border-orange-200'

            ? 'bg-emerald-50 text-emerald-700 border border-emerald-200'
            : 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30';

            ? 'bg-indigo-50 text-indigo-700 border border-indigo-200'

      /*************************************************************************
       * 5. GRADE CALCULATION & FORECASTING ENGINE
       *************************************************************************/
      function getSortedBuckets(buckets) {
        return [...(buckets || [])].sort((a, b) => Number(b.min) - Number(a.min));
      }

      function resolveBucket(buckets, percentage) {
        const sorted = getSortedBuckets(buckets);
        if (sorted.length === 0 || percentage === null || percentage === undefined || isNaN(percentage)) {
          return { current: null, nextHigher: null, nextLower: null };
        }
        const eps = percentage + 1e-9;
        let idx = sorted.findIndex(b => eps >= Number(b.min));
        if (idx === -1) idx = sorted.length - 1;

        return {
          current: sorted[idx],
          nextHigher: idx > 0 ? sorted[idx - 1] : null,
          nextLower: idx < sorted.length - 1 ? sorted[idx + 1] : null
        };
      }

      function computeClassMetrics(cls) {
        const groupMap = {};
        let totalConfiguredWeight = 0;

        cls.groups.forEach(g => {
          const w = Math.max(0, Number(g.weight) || 0);
          totalConfiguredWeight += w;
          groupMap[g.id] = {
            id: g.id,
            name: g.name,
            weight: w,
            actualEarned: 0,
            actualAvailable: 0,
            actualPct: null,
            forecastEarned: 0,
            forecastAvailable: 0,
            forecastPct: null,
            totalAllAvailable: 0
          };
        });

        let activeWhatIfCount = 0;

        cls.assignments.forEach(a => {
          const g = groupMap[a.groupId];
          if (!g) return;

          const avail = Math.max(0, Number(a.available) || 0);
          if (avail <= 0) return;

          g.totalAllAvailable += avail;

          const hasActual = isGradedValue(a.earned);
          const hasWhatIf = isGradedValue(a.whatIfEarned);

          if (hasWhatIf) {
            activeWhatIfCount++;
          }

          // Actual grade only includes graded assignments
          if (hasActual) {
            g.actualEarned += Number(a.earned);
            g.actualAvailable += avail;
          }

          // Forecast grade includes graded assignments (with What-If override if present)
          // PLUS ungraded assignments that have a What-If override score
          if (hasWhatIf) {
            g.forecastEarned += Number(a.whatIfEarned);
            g.forecastAvailable += avail;
          } else if (hasActual) {
            g.forecastEarned += Number(a.earned);
            g.forecastAvailable += avail;
          }
        });

        let actualWeightedNumerator = 0;
        let actualActiveWeight = 0;
        let totalActualEarnedPts = 0;
        let totalActualAvailPts = 0;

        let forecastWeightedNumerator = 0;
        let forecastActiveWeight = 0;
        let totalForecastEarnedPts = 0;
        let totalForecastAvailPts = 0;

        // Track exact earned weighted points vs remaining ungraded course weight for Target Forecaster
        let lockedWeightedContribution = 0;
        let remainingUngradedWeight = 0;

        cls.groups.forEach(grp => {
          const st = groupMap[grp.id];
          totalActualEarnedPts += st.actualEarned;
          totalActualAvailPts += st.actualAvailable;
          totalForecastEarnedPts += st.forecastEarned;
          totalForecastAvailPts += st.forecastAvailable;

          if (st.actualAvailable > 0) {
            st.actualPct = (st.actualEarned / st.actualAvailable) * 100;
            actualWeightedNumerator += st.actualPct * st.weight;
            actualActiveWeight += st.weight;
          }

          if (st.forecastAvailable > 0) {
            st.forecastPct = (st.forecastEarned / st.forecastAvailable) * 100;
            forecastWeightedNumerator += st.forecastPct * st.weight;
            forecastActiveWeight += st.weight;
          }

          // Exact proportional weight allocation within each group for Target Forecaster
          if (st.totalAllAvailable > 0) {
            const gradedFraction = st.actualAvailable / st.totalAllAvailable;
            const ungradedFraction = Math.max(0, 1 - gradedFraction);
            const currentGroupPct = st.actualPct !== null ? st.actualPct : 0;

            lockedWeightedContribution += (currentGroupPct / 100) * (st.weight * gradedFraction);
            remainingUngradedWeight += st.weight * ungradedFraction;
          } else {
            // Group has no assignment rows yet -> entire group weight is remaining ungraded weight
            remainingUngradedWeight += st.weight;
          }
        });

        const actualPct = actualActiveWeight > 0 ? (actualWeightedNumerator / actualActiveWeight) : null;
        const forecastPct = forecastActiveWeight > 0 ? (forecastWeightedNumerator / forecastActiveWeight) : null;

        const actualBucket = resolveBucket(cls.buckets, actualPct);
        const forecastBucket = resolveBucket(cls.buckets, forecastPct);

        return {
          groupMap,
          totalConfiguredWeight,
          actualActiveWeight,
          forecastActiveWeight,
          totalActualEarnedPts,
          totalActualAvailPts,
          totalForecastEarnedPts,
          totalForecastAvailPts,
          actualPct,
          forecastPct,
          actualBucket,
          forecastBucket,
          activeWhatIfCount,
          lockedWeightedContribution,
          remainingUngradedWeight
        };
      }

        const weightMismatch = Math.abs(metrics.totalConfiguredWeight - 100) > 0.05;

        // Class Tabs Strip
        const tabsHtml = state.classes.map(c => {

        }).join('');

        // Card 1: Current Actual Grade Margins
        let actualMarginHtml = `<span class="text-theme-faint">Enter earned points on assignments to see grade bucket margins.</span>`;
        if (metrics.actualPct !== null && metrics.actualBucket.current) {
          const { current, nextHigher, nextLower } = metrics.actualBucket;
          const upLine = nextHigher
            ? `<div class="flex items-center justify-between text-emerald-400">
                 <span><i class="fa-solid fa-arrow-up mr-1.5"></i>To reach <strong>${escapeHtml(nextHigher.letter)}</strong> (&ge;${formatPercent(nextHigher.min, 0)}):</span>
                 <span class="font-mono font-bold">+${formatPercent(Number(nextHigher.min) - metrics.actualPct, 2)}</span>
               </div>`
            : `<div class="text-emerald-400 font-semibold"><i class="fa-solid fa-crown mr-1.5"></i>Top grade bucket achieved (${escapeHtml(current.letter)})</div>`;

          const downLine = nextLower
            ? `<div class="flex items-center justify-between text-theme-muted">
                 <span><i class="fa-solid fa-shield-halved mr-1.5"></i>Margin above <strong>${escapeHtml(nextLower.letter)}</strong> (&lt;${formatPercent(current.min, 0)}):</span>
                 <span class="font-mono font-semibold">+${formatPercent(metrics.actualPct - Number(current.min), 2)}</span>
               </div>`
            : '';

          actualMarginHtml = upLine + downLine;
        }

        // Card 2: Forecast / What-If Grade Details
        let forecastDiffLabel = 'Matches Actual';
        if (metrics.actualPct !== null && metrics.forecastPct !== null) {
          const delta = metrics.forecastPct - metrics.actualPct;
          if (Math.abs(delta) >= 0.005) {
            forecastDiffLabel = `${delta > 0 ? '+' : ''}${formatPercent(delta, 2)} vs Actual`;
          }
        } else if (metrics.forecastPct !== null) {
          forecastDiffLabel = 'Projected';
        }

        let forecastMarginHtml = `<span>Enter a What-If score on any graded or ungraded row below to simulate your final grade.</span>`;
        if (metrics.forecastPct !== null && metrics.forecastBucket.current) {
          const { current, nextHigher } = metrics.forecastBucket;
          forecastMarginHtml = nextHigher
            ? `Projected <strong>${escapeHtml(current.letter)}</strong> — needs <strong>+${formatPercent(Number(nextHigher.min) - metrics.forecastPct, 2)}</strong> to reach <strong>${escapeHtml(nextHigher.letter)}</strong> (&ge;${formatPercent(nextHigher.min, 0)}).`
            : `Projected in the highest grade bucket <strong>${escapeHtml(current.letter)}</strong> (&ge;${formatPercent(current.min, 0)}).`;

        // Card 3: Target Grade Forecaster

                    <i class="fa-solid fa-plus"></i>
                    <span>Add Group</span>
                  </button>

              <div class="p-4 flex-1 overflow-x-auto">
                <table class="w-full text-left border-collapse">

                    <tr class="border-b border-theme text-[11px] font-bold uppercase tracking-wider text-theme-faint">

                      <th class="pb-2.5 text-right w-28">Weight (%)</th>
                      <th class="pb-2.5 text-right">Graded Pts</th>
                      <th class="pb-2.5 text-right">Actual %</th>

                      <td id="cellTotalWeight" class="py-3 text-right font-mono ${weightMismatch ? 'text-amber-400' : 'text-emerald-400'}">
                        ${formatPercent(metrics.totalConfiguredWeight, 1)}
                      </td>
                      <td id="cellTotalGroupPts" class="py-3 text-right font-mono text-theme-muted">
                        ${formatNumber(metrics.totalActualEarnedPts)} / ${formatNumber(metrics.totalActualAvailPts)}
                      </td>
                      <td id="cellFooterActualPct" class="py-3 text-right font-mono text-theme-primary">
                        ${metrics.actualPct !== null ? formatPercent(metrics.actualPct, 2) : '--%'}
                      </td>
                      <td id="cellFooterForecastPct" class="py-3 text-right font-mono text-indigo-400">

            </div>

            <!-- Right Column: Class Grade Bucket Distribution -->
            <div class="lg:col-span-5 surface-card rounded-2xl border flex flex-col overflow-hidden">

              <div class="p-4 flex-1 overflow-y-auto max-h-[380px]">

              </div>

          <!-- 5. Assignments Gradebook (Always Sorted by Assignment Group) -->
          <section class="surface-card rounded-2xl border overflow-hidden">
            <div class="px-5 py-4 border-b border-theme surface-alt flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <h2 class="text-base font-bold text-theme-primary flex items-center gap-2">
                  <i class="fa-solid fa-list-check text-indigo-400"></i>
                  <span>Assignments Gradebook</span>
                  <span class="px-2 py-0.5 rounded-full text-xs font-mono surface-pill border text-theme-muted">${cls.assignments.length}</span>

                    }"
                  >

                  </button>
                  <button
                    type="button"
                    data-action="set-gb-view"

                        ? 'bg-indigo-600 text-white shadow-xs'

        bindGradebookEvents();
      }

      function renderAssignmentRowHtml(cls, a, showGroupColumn) {
        const avail = Math.max(0, Number(a.available) || 0);
        const hasActual = isGradedValue(a.earned);
        const hasWhatIf = isGradedValue(a.whatIfEarned);

        const actualPct = hasActual && avail > 0 ? (Number(a.earned) / avail) * 100 : null;
        const effectiveScore = hasWhatIf ? Number(a.whatIfEarned) : (hasActual ? Number(a.earned) : null);
        const effectivePct = effectiveScore !== null && avail > 0 ? (effectiveScore / avail) * 100 : null;
        const isHighlighted = a.id === highlightedAssignmentId;

        return `
          <tr class="theme-row-hover transition border-b border-theme-subtle ${isHighlighted ? 'row-highlight-anim' : ''}" data-assign-id="${escapeHtml(a.id)}">
            <td class="py-2.5 pl-3 pr-2">
              <input
                type="text"
                value="${escapeHtml(a.name)}"
                data-assign-id="${escapeHtml(a.id)}"
                data-assign-field="name"
                aria-label="Assignment Name"
                class="w-full min-w-[170px] text-xs font-semibold theme-inline-input rounded-lg px-2 py-1"
              />
            </td>
            <td class="py-2.5 px-2">
              <select
                data-assign-id="${escapeHtml(a.id)}"
                data-assign-field="groupId"
                aria-label="Assignment Group"
                class="text-xs font-medium theme-select rounded-lg px-2 py-1"
              >
                ${cls.groups.map(g => `
                  <option value="${escapeHtml(g.id)}" data-group-option-id="${escapeHtml(g.id)}" ${g.id === a.groupId ? 'selected' : ''}>
                    ${escapeHtml(g.name)}
                  </option>
                `).join('')}
              </select>
            </td>
            <td class="py-2.5 px-2 text-right">
              <input
                type="number"
                step="any"
                min="0"
                placeholder="Ungraded"
                value="${hasActual ? a.earned : ''}"
                data-assign-id="${escapeHtml(a.id)}"
                data-assign-field="earned"
                aria-label="Points Earned"
                class="w-24 text-right font-mono text-xs font-semibold theme-input rounded-lg px-2 py-1"
              />
            </td>
            <td class="py-2.5 px-2 text-right">
              <input
                type="number"
                step="any"
                min="0.01"
                value="${a.available}"
                data-assign-id="${escapeHtml(a.id)}"
                data-assign-field="available"
                aria-label="Total Available Points"
                class="w-24 text-right font-mono text-xs font-semibold theme-input rounded-lg px-2 py-1"
              />
            </td>
            <td class="py-2.5 px-2 text-right">
              <span data-assign-pct-pill="${escapeHtml(a.id)}" class="inline-block px-2.5 py-0.5 rounded-md font-mono text-[11px] font-bold ${getScorePillClasses(actualPct)}">
                ${actualPct !== null ? formatPercent(actualPct, 1) : 'Ungraded'}
              </span>
            </td>
            <td class="py-2.5 px-2 text-right">
              <div class="inline-flex items-center justify-end gap-1">
                <input
                  type="number"
                  step="any"
                  min="0"
                  placeholder="What-If"
                  value="${hasWhatIf ? a.whatIfEarned : ''}"
                  data-assign-id="${escapeHtml(a.id)}"
                  data-assign-field="whatIfEarned"
                  aria-label="What-If Override Score"
                  class="w-24 text-right font-mono text-xs theme-input rounded-lg px-2 py-1"
                />
                ${hasWhatIf ? `
                  <button
                    type="button"
                    data-action="clear-row-whatif"
                    data-assign-id="${escapeHtml(a.id)}"
                    title="Clear What-If override"
                    class="text-theme-faint hover:text-rose-400 p-1 cursor-pointer"
                  >
                    <i class="fa-solid fa-xmark text-xs"></i>
                  </button>
                ` : ''}
              </div>
            </td>
            <td class="py-2.5 px-2 text-right">
              <span data-assign-forecast-pill="${escapeHtml(a.id)}" class="inline-block px-2 py-0.5 rounded-md font-mono text-[11px] font-semibold ${hasWhatIf ? 'accent-pill border' : 'text-theme-faint'}">
                ${effectivePct !== null ? formatPercent(effectivePct, 1) : '--%'}
              </span>
            </td>
            <td class="py-2.5 pr-3 pl-1 text-right">
              <button
                type="button"
                data-action="delete-assignment"
                data-assign-id="${escapeHtml(a.id)}"
                title="Delete Assignment"
                class="text-theme-faint hover:text-rose-400 p-1.5 rounded-lg transition cursor-pointer"
              >
                <i class="fa-regular fa-trash-can text-xs"></i>
              </button>
            </td>
          </tr>
        `;
      }

      function renderAssignmentsGradebookHtml(cls, metrics) {
        if (state.gradebookViewMode === 'unified') {
          const groupOrder = {};
          cls.groups.forEach((g, idx) => { groupOrder[g.id] = idx; });

          const sortedAssignments = [...cls.assignments].sort((a, b) => {
            const idxA = groupOrder[a.groupId] ?? 999;
            const idxB = groupOrder[b.groupId] ?? 999;
            return idxA - idxB;
          });

          if (sortedAssignments.length === 0) {
            return `<div class="text-center py-10 text-xs text-theme-faint">No assignments in this class yet. Click <strong>+ Add Assignment</strong> above to create an entry.</div>`;
          }

          return `
            <div class="overflow-x-auto rounded-xl border border-theme">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-theme surface-alt text-[11px] font-bold uppercase tracking-wider text-theme-faint">
                    <th class="py-2.5 pl-3">Assignment Name</th>
                    <th class="py-2.5 px-2">Assignment Group</th>
                    <th class="py-2.5 px-2 text-right">Points Earned</th>
                    <th class="py-2.5 px-2 text-right">Available Pts</th>
                    <th class="py-2.5 px-2 text-right">Actual %</th>
                    <th class="py-2.5 px-2 text-right">What-If Override</th>
                    <th class="py-2.5 px-2 text-right">Forecast %</th>
                    <th class="py-2.5 pr-3 text-right">Delete</th>
                  </tr>
                </thead>
                <tbody class="text-xs">
                  ${sortedAssignments.map(a => renderAssignmentRowHtml(cls, a, true)).join('')}
                </tbody>
              </table>
            </div>
          `;
        }

        // Default: Grouped by Assignment Group
        return cls.groups.map((grp, idx) => {
          const groupAssignments = cls.assignments.filter(a => a.groupId === grp.id);
          const st = metrics.groupMap[grp.id];
          const dotColor = GROUP_DOT_COLORS[idx % GROUP_DOT_COLORS.length];

          return `
            <div class="rounded-2xl border border-theme overflow-hidden">
              <div class="px-4 py-3 surface-alt border-b border-theme flex flex-wrap items-center justify-between gap-2">
                <div class="flex flex-wrap items-center gap-2.5">
                  <span class="w-3 h-3 rounded-full ${dotColor}"></span>
                  <h3 data-section-group-title="${escapeHtml(grp.id)}" class="text-sm font-bold text-theme-primary">${escapeHtml(grp.name)}</h3>
                  <span data-section-group-weight="${escapeHtml(grp.id)}" class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold accent-pill border">
                    Weight: ${formatPercent(grp.weight, 1)}
                  </span>
                  <span data-section-subtotal="${escapeHtml(grp.id)}" class="text-xs font-mono text-theme-muted">
                    ${st ? `${formatNumber(st.actualEarned)} / ${formatNumber(st.actualAvailable)} pts` : '0 / 0 pts'}
                  </span>
                </div>

                <div class="flex items-center gap-2">
                  <span data-section-pct="${escapeHtml(grp.id)}" class="px-2.5 py-0.5 rounded-lg font-mono text-xs font-bold ${getScorePillClasses(st ? st.actualPct : null)}">
                    ${st && st.actualPct !== null ? formatPercent(st.actualPct, 1) : 'Ungraded'}
                  </span>
                  <button
                    type="button"
                    data-action="add-to-group"
                    data-group-id="${escapeHtml(grp.id)}"
                    class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-xs transition cursor-pointer"
                  >
                    <i class="fa-solid fa-plus"></i>
                    <span data-section-add-btn-label="${escapeHtml(grp.id)}">Add to ${escapeHtml(grp.name)}</span>
                  </button>
                </div>
              </div>

              ${groupAssignments.length === 0 ? `
                <div class="px-4 py-6 text-center text-xs text-theme-faint">
                  No assignments in <strong data-section-empty-group-name="${escapeHtml(grp.id)}">${escapeHtml(grp.name)}</strong> yet. Click <strong data-section-empty-btn-label="${escapeHtml(grp.id)}">+ Add to ${escapeHtml(grp.name)}</strong> above.
                </div>
              ` : `
                <div class="overflow-x-auto">
                  <table class="w-full text-left border-collapse">
                    <thead>
                      <tr class="border-b border-theme-subtle text-[10px] font-bold uppercase tracking-wider text-theme-faint">
                        <th class="py-2 pl-3">Assignment Name</th>
                        <th class="py-2 px-2">Assignment Group</th>
                        <th class="py-2 px-2 text-right">Points Earned</th>
                        <th class="py-2 px-2 text-right">Available Pts</th>
                        <th class="py-2 px-2 text-right">Actual %</th>
                        <th class="py-2 px-2 text-right">What-If Override</th>
                        <th class="py-2 px-2 text-right">Forecast %</th>
                        <th class="py-2 pr-3 text-right">Delete</th>
                      </tr>
                    </thead>
                    <tbody class="text-xs">
                      ${groupAssignments.map(a => renderAssignmentRowHtml(cls, a, false)).join('')}
                    </tbody>
                  </table>
                </div>
              `}
            </div>
          `;
        }).join('');
      }

      function refreshLiveGradebookMetrics() {
        const cls = getActiveClass();
        if (!cls) return;
        const metrics = computeClassMetrics(cls);
        const sortedBuckets = getSortedBuckets(cls.buckets);
        const weightMismatch = Math.abs(metrics.totalConfiguredWeight - 100) > 0.05;

        // Card 1: Current Actual Grade
        const badgeActualWeight = document.getElementById('badgeActualWeight');
        const displayActualPct = document.getElementById('displayActualPct');
        const displayActualPts = document.getElementById('displayActualPts');
        const badgeActualLetter = document.getElementById('badgeActualLetter');
        const boxActualMargins = document.getElementById('boxActualMargins');

        if (badgeActualWeight) badgeActualWeight.textContent = `${formatPercent(metrics.actualActiveWeight, 0)} weight graded`;
        if (displayActualPct) displayActualPct.textContent = metrics.actualPct !== null ? formatPercent(metrics.actualPct, 2) : '--%';
        if (displayActualPts) displayActualPts.textContent = `Graded points: ${formatNumber(metrics.totalActualEarnedPts)} / ${formatNumber(metrics.totalActualAvailPts)}`;
        if (badgeActualLetter) {
          const ltr = metrics.actualBucket.current ? metrics.actualBucket.current.letter : '--';
          badgeActualLetter.textContent = ltr;
          badgeActualLetter.className = `inline-flex items-center justify-center min-w-[64px] h-16 px-4 rounded-2xl text-3xl font-extrabold border ${getLetterBadgeClasses(ltr)}`;
        }
        if (boxActualMargins) {
          if (metrics.actualPct === null || !metrics.actualBucket.current) {
            boxActualMargins.innerHTML = `<span class="text-theme-faint">Enter earned points on assignments to see grade bucket margins.</span>`;
          } else {
            const { current, nextHigher, nextLower } = metrics.actualBucket;
            const upLine = nextHigher
              ? `<div class="flex items-center justify-between text-emerald-400">
                   <span><i class="fa-solid fa-arrow-up mr-1.5"></i>To reach <strong>${escapeHtml(nextHigher.letter)}</strong> (&ge;${formatPercent(nextHigher.min, 0)}):</span>
                   <span class="font-mono font-bold">+${formatPercent(Number(nextHigher.min) - metrics.actualPct, 2)}</span>
                 </div>`
              : `<div class="text-emerald-400 font-semibold"><i class="fa-solid fa-crown mr-1.5"></i>Top grade bucket achieved (${escapeHtml(current.letter)})</div>`;

            const downLine = nextLower
              ? `<div class="flex items-center justify-between text-theme-muted">
                   <span><i class="fa-solid fa-shield-halved mr-1.5"></i>Margin above <strong>${escapeHtml(nextLower.letter)}</strong> (&lt;${formatPercent(current.min, 0)}):</span>
                   <span class="font-mono font-semibold">+${formatPercent(metrics.actualPct - Number(current.min), 2)}</span>
                 </div>`
              : '';
            boxActualMargins.innerHTML = upLine + downLine;
          }
        }

        // Card 2: Forecast Grade
        const badgeForecastDelta = document.getElementById('badgeForecastDelta');
        const displayForecastPct = document.getElementById('displayForecastPct');
        const badgeForecastLetter = document.getElementById('badgeForecastLetter');
        const boxForecastMargins = document.getElementById('boxForecastMargins');
        const labelWhatIfCount = document.getElementById('labelWhatIfCount');

        if (badgeForecastDelta) {
          let lbl = 'Matches Actual';
          if (metrics.actualPct !== null && metrics.forecastPct !== null) {
            const delta = metrics.forecastPct - metrics.actualPct;
            if (Math.abs(delta) >= 0.005) {
              lbl = `${delta > 0 ? '+' : ''}${formatPercent(delta, 2)} vs Actual`;
            }
          } else if (metrics.forecastPct !== null) {
            lbl = 'Projected';
          }
          badgeForecastDelta.textContent = lbl;
        }
        if (displayForecastPct) displayForecastPct.textContent = metrics.forecastPct !== null ? formatPercent(metrics.forecastPct, 2) : '--%';
        if (badgeForecastLetter) badgeForecastLetter.textContent = metrics.forecastBucket.current ? metrics.forecastBucket.current.letter : '--';
        if (labelWhatIfCount) labelWhatIfCount.textContent = `${metrics.activeWhatIfCount} active What-If ${metrics.activeWhatIfCount === 1 ? 'override' : 'overrides'}`;
        if (boxForecastMargins) {
          if (metrics.forecastPct === null || !metrics.forecastBucket.current) {
            boxForecastMargins.innerHTML = `<span>Enter a What-If score on any graded or ungraded row below to simulate your final grade.</span>`;
          } else {
            const { current, nextHigher } = metrics.forecastBucket;
            boxForecastMargins.innerHTML = nextHigher
              ? `Projected <strong>${escapeHtml(current.letter)}</strong> — needs <strong>+${formatPercent(Number(nextHigher.min) - metrics.forecastPct, 2)}</strong> to reach <strong>${escapeHtml(nextHigher.letter)}</strong> (&ge;${formatPercent(nextHigher.min, 0)}).`
              : `Projected in the highest grade bucket <strong>${escapeHtml(current.letter)}</strong> (&ge;${formatPercent(current.min, 0)}).`;
          }
        }

        // Card 3: Target Grade Forecaster
        const boxTargetForecastResult = document.getElementById('boxTargetForecastResult');
        const displayRemainingWeight = document.getElementById('displayRemainingWeight');
        if (displayRemainingWeight) displayRemainingWeight.textContent = formatPercent(metrics.remainingUngradedWeight, 1);

        if (boxTargetForecastResult) {
          const selectableTargetBuckets = sortedBuckets.filter(b => Number(b.min) > 0);
          const activeTargetBucket = selectableTargetBuckets.find(b => b.letter === cls.targetLetter) || selectableTargetBuckets[1] || sortedBuckets[0];
          if (activeTargetBucket) {
            const targetCutoff = Number(activeTargetBucket.min);
            const remWeight = Math.max(0, metrics.remainingUngradedWeight);

            if (remWeight <= 0.01) {
              const reached = metrics.actualPct !== null && metrics.actualPct + 1e-9 >= targetCutoff;
              boxTargetForecastResult.innerHTML = reached
                ? `<div class="text-emerald-400 font-semibold"><i class="fa-solid fa-circle-check mr-1.5"></i>All course weight is graded! You achieved <strong>${escapeHtml(activeTargetBucket.letter)}</strong> (${formatPercent(metrics.actualPct, 2)}).</div>`
                : `<div class="text-amber-400 font-semibold"><i class="fa-solid fa-circle-info mr-1.5"></i>All course weight is graded at ${formatPercent(metrics.actualPct, 2)} (cutoff for ${escapeHtml(activeTargetBucket.letter)} is ${formatPercent(targetCutoff, 0)}).</div>`;
            } else {
              const neededWeightedPts = (targetCutoff / 100) * metrics.totalConfiguredWeight - metrics.lockedWeightedContribution;
              const neededAvgPct = (neededWeightedPts / remWeight) * 100;

              if (neededAvgPct <= 0) {
                boxTargetForecastResult.innerHTML = `<div class="text-emerald-400 font-semibold"><i class="fa-solid fa-lock mr-1.5"></i><strong>${escapeHtml(activeTargetBucket.letter)}</strong> (&ge;${formatPercent(targetCutoff, 0)}) is already locked in even with 0% on the remaining ${formatPercent(remWeight, 1)} weight!</div>`;
              } else if (neededAvgPct > 100) {
                const maxPossible = ((metrics.lockedWeightedContribution + remWeight) / (metrics.totalConfiguredWeight || 100)) * 100;
                boxTargetForecastResult.innerHTML = `<div class="text-rose-400 font-semibold"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i>Requires <strong>${formatPercent(neededAvgPct, 2)}</strong> across remaining ${formatPercent(remWeight, 1)} weight (max without extra credit: <strong>${formatPercent(maxPossible, 2)}</strong>).</div>`;
              } else {
                boxTargetForecastResult.innerHTML = `
                  <div class="text-theme-secondary">
                    To finish with <strong class="text-indigo-400">${escapeHtml(activeTargetBucket.letter)} (&ge;${formatPercent(targetCutoff, 0)})</strong>, you need an average of:
                  </div>
                  <div class="text-2xl font-extrabold font-mono text-indigo-400 mt-1">
                    ${formatPercent(neededAvgPct, 2)}
                    <span class="text-xs font-sans font-normal text-theme-muted">across remaining ${formatPercent(remWeight, 1)} weight</span>
                  </div>`;
              }
            }
          }
        }

        // Assignment Group Weights & Totals
        const badgeWeightWarning = document.getElementById('badgeWeightWarning');
        const btnNormalizeWeights = document.getElementById('btnNormalizeWeights');
        const cellTotalWeight = document.getElementById('cellTotalWeight');
        const cellTotalGroupPts = document.getElementById('cellTotalGroupPts');
        const cellFooterActualPct = document.getElementById('cellFooterActualPct');
        const cellFooterForecastPct = document.getElementById('cellFooterForecastPct');

        if (badgeWeightWarning) badgeWeightWarning.classList.toggle('hidden', !weightMismatch);
        if (btnNormalizeWeights) btnNormalizeWeights.classList.toggle('hidden', !weightMismatch);
        if (cellTotalWeight) {
          cellTotalWeight.textContent = formatPercent(metrics.totalConfiguredWeight, 1);
          cellTotalWeight.className = `py-3 text-right font-mono ${weightMismatch ? 'text-amber-400' : 'text-emerald-400'}`;
        }
        if (cellTotalGroupPts) cellTotalGroupPts.textContent = `${formatNumber(metrics.totalActualEarnedPts)} / ${formatNumber(metrics.totalActualAvailPts)}`;
        if (cellFooterActualPct) cellFooterActualPct.textContent = metrics.actualPct !== null ? formatPercent(metrics.actualPct, 2) : '--%';
        if (cellFooterForecastPct) cellFooterForecastPct.textContent = metrics.forecastPct !== null ? formatPercent(metrics.forecastPct, 2) : '--%';

        cls.groups.forEach(g => {
          const st = metrics.groupMap[g.id];
          if (!st) return;

          const ptsCell = document.querySelector(`[data-stat-group-pts="${g.id}"]`);
          const actCell = document.querySelector(`[data-stat-group-actual="${g.id}"]`);
          const foreCell = document.querySelector(`[data-stat-group-forecast="${g.id}"]`);
          const secSub = document.querySelector(`[data-section-subtotal="${g.id}"]`);
          const secPct = document.querySelector(`[data-section-pct="${g.id}"]`);
          const secWeight = document.querySelector(`[data-section-group-weight="${g.id}"]`);

          if (ptsCell) ptsCell.textContent = `${formatNumber(st.actualEarned)} / ${formatNumber(st.actualAvailable)}`;
          if (actCell) actCell.textContent = st.actualPct !== null ? formatPercent(st.actualPct, 1) : '--%';
          if (foreCell) foreCell.textContent = st.forecastPct !== null ? formatPercent(st.forecastPct, 1) : '--%';
          if (secSub) secSub.textContent = `${formatNumber(st.actualEarned)} / ${formatNumber(st.actualAvailable)} pts`;
          if (secWeight) secWeight.textContent = `Weight: ${formatPercent(g.weight, 1)}`;
          if (secPct) {
            secPct.textContent = st.actualPct !== null ? formatPercent(st.actualPct, 1) : 'Ungraded';
            secPct.className = `px-2.5 py-0.5 rounded-lg font-mono text-xs font-bold ${getScorePillClasses(st.actualPct)}`;
          }
        });
        // Update Class Bucket Status Badges & Range Labels In-Place
        const activeActualId = metrics.actualBucket.current ? metrics.actualBucket.current.id : null;
        const activeForecastId = metrics.forecastBucket.current ? metrics.forecastBucket.current.id : null;

        sortedBuckets.forEach((b, idx) => {
          const rangeCell = document.querySelector(`[data-bucket-range="${b.id}"]`);
          if (rangeCell) {
            const upperLabel = idx === 0 ? '100%' : `< ${formatPercent(sortedBuckets[idx - 1].min, 0)}`;
            rangeCell.textContent = `${formatPercent(b.min, 0)} – ${upperLabel}`;
          }

          const cell = document.querySelector(`[data-bucket-status="${b.id}"]`);
          if (!cell) return;
          if (b.id === activeActualId && b.id === activeForecastId) {
            cell.innerHTML = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">Actual &amp; Forecast</span>`;
          } else if (b.id === activeActualId) {
            cell.innerHTML = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-indigo-500/15 text-indigo-400 border border-indigo-500/30">Actual</span>`;
          } else if (b.id === activeForecastId) {
            cell.innerHTML = `<span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-500/15 text-amber-400 border border-amber-500/30">Forecast</span>`;
          } else {
            cell.innerHTML = `<span class="text-theme-faint">—</span>`;
          }
        });

        // Update active class tab badge in top strip
        const activeTab = document.querySelector(`[data-action="select-class"][data-class-id="${cls.id}"] span:last-child`);
        if (activeTab) {
          const ltr = metrics.actualBucket.current ? metrics.actualBucket.current.letter : '--';
          const pStr = metrics.actualPct !== null ? formatPercent(metrics.actualPct, 1) : '--%';
          activeTab.textContent = `${ltr} (${pStr})`;
        }
      }

      function updateGroupNameInDOM(groupId, newName) {
        const displayLabel = newName.trim() || 'Unnamed Group';

        document.querySelectorAll(`[data-section-group-title="${groupId}"]`).forEach(el => {
          el.textContent = displayLabel;
        });

        document.querySelectorAll(`[data-section-add-btn-label="${groupId}"]`).forEach(el => {
          el.textContent = `Add to ${displayLabel}`;
        });

        document.querySelectorAll(`[data-section-empty-group-name="${groupId}"]`).forEach(el => {
          el.textContent = displayLabel;
        });

        document.querySelectorAll(`[data-section-empty-btn-label="${groupId}"]`).forEach(el => {
          el.textContent = `+ Add to ${displayLabel}`;
        });

        document.querySelectorAll(`option[data-group-option-id="${groupId}"]`).forEach(opt => {
          opt.textContent = displayLabel;
        });
      }

      function bindGradebookEvents() {
        const cls = getActiveClass();
        if (!cls) return;

        // Class Tab Selection
        document.querySelectorAll('[data-action="select-class"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const cid = btn.getAttribute('data-class-id');
            if (cid && cid !== state.activeClassId) {
              state.activeClassId = cid;
              saveState();
              renderApp();
            }
          });
        });

        // Add Class
        document.getElementById('btnAddClass')?.addEventListener('click', () => {
          const newId = uid('class');
          const g1 = uid('grp');
          const g2 = uid('grp');
          const g3 = uid('grp');
          const num = state.classes.length + 1;

          state.classes.push({
            id: newId,
            code: `COURSE ${100 + num}`,
            name: `General Course ${num}`,
            term: 'Term 1',
            targetLetter: 'A',
            groups: [
              { id: g1, name: 'Assignments', weight: 30 },
              { id: g2, name: 'Midterm Exam', weight: 30 },
              { id: g3, name: 'Final Exam', weight: 40 }
            ],
            buckets: cloneGradeScale(state.defaultGradeDefinitions),
            assignments: [
              { id: uid('asg'), name: 'Assignment 1', groupId: g1, earned: 45, available: 50, whatIfEarned: null },
              { id: uid('asg'), name: 'Midterm Exam', groupId: g2, earned: null, available: 100, whatIfEarned: null },
              { id: uid('asg'), name: 'Final Exam', groupId: g3, earned: null, available: 150, whatIfEarned: null }
            ]
          });

          state.activeClassId = newId;
          saveState();
          renderApp();
          showToast('Created new class gradebook', 'success');
        });

        // Duplicate Class
        document.getElementById('btnDuplicateClass')?.addEventListener('click', () => {
          const copy = JSON.parse(JSON.stringify(cls));
          copy.id = uid('class');
          copy.code = `${cls.code} (Copy)`;
          state.classes.push(copy);
          state.activeClassId = copy.id;
          saveState();
          renderApp();
          showToast(`Duplicated "${cls.code}"`, 'success');
        });

        // Delete Class
        document.getElementById('btnDeleteClass')?.addEventListener('click', () => {
          if (state.classes.length <= 1) {
            showToast('At least one class gradebook must remain active.', 'warning');
            return;
          }
          openConfirmModal(
            `Delete "${cls.code}: ${cls.name}"?`,
            `This will permanently remove this class and all ${cls.assignments.length} assignment entries.`,
            () => {
              state.classes = state.classes.filter(c => c.id !== cls.id);
              state.activeClassId = state.classes[0].id;
              saveState();
              renderApp();
              showToast('Deleted class gradebook', 'info');
            }
          );
        });

        // Editable Class Header Inputs
        document.getElementById('inputClassCode')?.addEventListener('input', (e) => {
          cls.code = e.target.value;
          saveState();
          const tabCode = document.querySelector(`[data-action="select-class"][data-class-id="${cls.id}"] span.font-bold`);
          if (tabCode) tabCode.textContent = cls.code || 'COURSE';
        });

        document.getElementById('inputClassName')?.addEventListener('input', (e) => {
          cls.name = e.target.value;
          saveState();
          const tabName = document.querySelector(`[data-action="select-class"][data-class-id="${cls.id}"] span.truncate`);
          if (tabName) tabName.textContent = cls.name;
        });

        document.getElementById('inputClassTerm')?.addEventListener('input', (e) => {
          cls.term = e.target.value;
          saveState();
        });

        // Clear What-Ifs
        document.getElementById('btnClearWhatIfs')?.addEventListener('click', () => {
          cls.assignments.forEach(a => { a.whatIfEarned = null; });
          saveState();
          renderApp();
          showToast('Cleared all What-If overrides', 'info');
        });

        // Target Grade Selector
        document.getElementById('selectTargetGrade')?.addEventListener('change', (e) => {
          cls.targetLetter = e.target.value;
          saveState();
          refreshLiveGradebookMetrics();
        });

        // Assignment Groups Table (In-place updates without losing focus, caret, or scroll)
        document.getElementById('tbodyAssignmentGroups')?.addEventListener('input', (e) => {
          const target = e.target;
          const gid = target.getAttribute('data-group-id');
          const field = target.getAttribute('data-group-field');
          if (!gid || !field) return;

          const grp = cls.groups.find(g => g.id === gid);
          if (!grp) return;

          if (field === 'name') {
            grp.name = target.value;
            saveState();
            updateGroupNameInDOM(gid, grp.name);
          } else if (field === 'weight') {
            grp.weight = Math.max(0, parseFloat(target.value) || 0);
            saveState();
            refreshLiveGradebookMetrics();
          }
        });

        document.getElementById('tbodyAssignmentGroups')?.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-action="delete-group"]');
          if (!btn) return;
          const gid = btn.getAttribute('data-group-id');
          if (cls.groups.length <= 1) {
            showToast('A class must keep at least one assignment group.', 'warning');
            return;
          }
          const grp = cls.groups.find(g => g.id === gid);
          const fallback = cls.groups.find(g => g.id !== gid);
          const count = cls.assignments.filter(a => a.groupId === gid).length;

          openConfirmModal(
            `Delete "${grp.name}" Group?`,
            count > 0
              ? `This group has ${count} assignment(s). They will be reassigned to "${fallback.name}".`
              : `Are you sure you want to delete the "${grp.name}" group?`,
            () => {
              cls.assignments.forEach(a => {
                if (a.groupId === gid) a.groupId = fallback.id;
              });
              cls.groups = cls.groups.filter(g => g.id !== gid);
              saveState();
              renderApp();
              showToast(`Removed group "${grp.name}"`, 'info');
            }
          );
        });

        // Add Group
        document.getElementById('btnAddGroup')?.addEventListener('click', () => {
          const currentSum = cls.groups.reduce((acc, g) => acc + (Number(g.weight) || 0), 0);
          const suggested = currentSum < 100 ? Number((100 - currentSum).toFixed(1)) : 10;
          cls.groups.push({
            id: uid('grp'),
            name: `Group ${cls.groups.length + 1}`,
            weight: suggested
          });
          saveState();
          renderApp();
          showToast('Added new assignment group', 'success');
        });

        // Normalize Weights to 100%
        document.getElementById('btnNormalizeWeights')?.addEventListener('click', () => {
          const total = cls.groups.reduce((acc, g) => acc + (Number(g.weight) || 0), 0);
          if (total <= 0) {
            const equal = Number((100 / cls.groups.length).toFixed(2));
            cls.groups.forEach(g => { g.weight = equal; });
          } else {
            cls.groups.forEach(g => {
              g.weight = Number(((Number(g.weight) / total) * 100).toFixed(2));
            });
          }
          const sumAfter = cls.groups.reduce((acc, g) => acc + g.weight, 0);
          if (cls.groups.length > 0 && Math.abs(100 - sumAfter) > 0) {
            cls.groups[cls.groups.length - 1].weight = Number((cls.groups[cls.groups.length - 1].weight + (100 - sumAfter)).toFixed(2));
          }
          saveState();
          renderApp();
          showToast('Normalized assignment group weights to 100%', 'success');
        });

        // Class Grade Buckets Table
        document.getElementById('tbodyClassBuckets')?.addEventListener('input', (e) => {
          const input = e.target;
          const bid = input.getAttribute('data-bucket-id');
          if (!bid) return;
          const bucket = cls.buckets.find(b => b.id === bid);
        // Class Grade Buckets Table (In-place updates without losing focus or scroll)
        document.getElementById('tbodyClassBuckets')?.addEventListener('input', (e) => {
          const input = e.target;
          const bid = input.getAttribute('data-bucket-id');
          if (!bid) return;
          const bucket = cls.buckets.find(b => b.id === bid);
          if (!bucket) return;

          bucket.min = Math.max(0, Math.min(100, parseFloat(input.value) || 0));
          saveState();
          refreshLiveGradebookMetrics();
        });

        document.getElementById('btnResetClassBuckets')?.addEventListener('click', () => {
          cls.buckets = cloneGradeScale(state.defaultGradeDefinitions);
          saveState();
          renderApp();
          showToast('Reset class buckets to saved default scale', 'success');
        });

        // Gradebook View Toggle
        document.querySelectorAll('[data-action="set-gb-view"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const mode = btn.getAttribute('data-mode');
            if (mode && mode !== state.gradebookViewMode) {
              state.gradebookViewMode = mode;
              saveState();
              renderApp();
            }
          });
        });

        // Global Add Assignment
        document.getElementById('btnAddAssignmentGlobal')?.addEventListener('click', () => {
          const firstGroup = cls.groups[0];
          if (!firstGroup) return;
          const newId = uid('asg');
          cls.assignments.push({
            id: newId,
            name: `Assignment ${cls.assignments.length + 1}`,
            groupId: firstGroup.id,
            earned: null,
            available: 100,
            whatIfEarned: null
          });
          highlightedAssignmentId = newId;
          saveState();
          renderApp();
          highlightedAssignmentId = null;
          showToast(`Added assignment to ${firstGroup.name}`, 'success');
        });

        // Delegated Events inside Gradebook Assignments Body
        const gbBody = document.getElementById('gradebookAssignmentsBody');

        gbBody?.addEventListener('input', (e) => {
          const input = e.target;
          const aid = input.getAttribute('data-assign-id');
          const field = input.getAttribute('data-assign-field');
          if (!aid || !field || field === 'groupId') return;

          const assign = cls.assignments.find(a => a.id === aid);
          if (!assign) return;

          if (field === 'name') {
            assign.name = input.value;
          } else if (field === 'earned') {
            const raw = input.value.trim();
            assign.earned = raw === '' ? null : parseFloat(raw);
          } else if (field === 'available') {
            assign.available = Math.max(0.01, parseFloat(input.value) || 0.01);
          } else if (field === 'whatIfEarned') {
            const raw = input.value.trim();
            assign.whatIfEarned = raw === '' ? null : parseFloat(raw);
          }

          saveState();
          refreshLiveGradebookMetrics();
        });

        gbBody?.addEventListener('change', (e) => {
          const select = e.target;
          if (select.getAttribute('data-assign-field') !== 'groupId') return;
          const aid = select.getAttribute('data-assign-id');
          const assign = cls.assignments.find(a => a.id === aid);
          if (!assign) return;

          assign.groupId = select.value;
          highlightedAssignmentId = aid;
          const targetGroup = cls.groups.find(g => g.id === select.value);

          saveState();
          renderApp();
          highlightedAssignmentId = null;
          if (targetGroup) {
            showToast(`Moved "${assign.name}" to ${targetGroup.name}`, 'info');
          }
        });

        gbBody?.addEventListener('click', (e) => {
          const btn = e.target.closest('button[data-action]');
          if (!btn) return;
          const action = btn.getAttribute('data-action');

          if (action === 'add-to-group') {
            const gid = btn.getAttribute('data-group-id');
            const grp = cls.groups.find(g => g.id === gid);
            if (!grp) return;
            const countInGroup = cls.assignments.filter(a => a.groupId === gid).length + 1;
            const newId = uid('asg');
            cls.assignments.push({
              id: newId,
              name: `${grp.name} ${countInGroup}`,
              groupId: gid,
              earned: null,
              available: 100,
              whatIfEarned: null
            });
            highlightedAssignmentId = newId;
            saveState();
            renderApp();
            highlightedAssignmentId = null;
            showToast(`Added entry to ${grp.name}`, 'success');
          } else if (action === 'delete-assignment') {
            const aid = btn.getAttribute('data-assign-id');
            cls.assignments = cls.assignments.filter(a => a.id !== aid);
            saveState();
            renderApp();
            showToast('Deleted assignment entry', 'info');
          } else if (action === 'clear-row-whatif') {
            const aid = btn.getAttribute('data-assign-id');
            const assign = cls.assignments.find(a => a.id === aid);
            if (!assign) return;
            assign.whatIfEarned = null;
            saveState();
            renderApp();
          }
        });
      }
