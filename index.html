    function renderGradebook() {
      const cls = getActiveClass();
      const container = document.getElementById('assignmentsGradebookContainer');
      const countPill = document.getElementById('assignmentsCountPill');
      const viewGroupedBtn = document.getElementById('viewGroupedBtn');
      const viewFlatBtn = document.getElementById('viewFlatSortedBtn');
      if (!cls || !container) return;

      // Update view switcher styling
      if (viewGroupedBtn && viewFlatBtn) {
        if (appState.viewMode === 'grouped') {
          viewGroupedBtn.className = 'px-2.5 py-1 rounded-lg transition bg-white text-slate-900 shadow-sm';
          viewFlatBtn.className = 'px-2.5 py-1 rounded-lg transition text-slate-600 hover:text-slate-900';
        } else {
          viewFlatBtn.className = 'px-2.5 py-1 rounded-lg transition bg-white text-slate-900 shadow-sm';
          viewGroupedBtn.className = 'px-2.5 py-1 rounded-lg transition text-slate-600 hover:text-slate-900';
        }
      }

      // Filter assignments
      const filtered = cls.assignments.filter(a => {
        if (filterGroupId !== 'ALL' && a.groupId !== filterGroupId) return false;
        const hasWhatIf = a.whatIfEarned !== null && a.whatIfEarned !== '' && !isNaN(Number(a.whatIfEarned));
        if (filterMode === 'ACTUAL' && a.isForecast) return false;
        if (filterMode === 'FORECAST' && !a.isForecast && !hasWhatIf) return false;
        return true;
      });

      if (countPill) countPill.textContent = filtered.length;

      if (appState.viewMode === 'flat') {
        // Sort strictly by Assignment Group order in cls.groups
        const groupOrderMap = {};
        cls.groups.forEach((g, idx) => { groupOrderMap[g.id] = idx; });

        const sortedAssignments = [...filtered].sort((a, b) => {
          const idxA = groupOrderMap[a.groupId] ?? 999;
          const idxB = groupOrderMap[b.groupId] ?? 999;
          return idxA - idxB;
        });

        container.innerHTML = `
          <div class="overflow-x-auto border border-slate-200 rounded-xl">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="border-b border-slate-200 bg-slate-50 text-[11px] font-bold uppercase tracking-wider text-slate-400">
                  <th class="py-3 pl-3">Assignment</th>
                  <th class="py-3 px-2">Assignment Group (Sorted)</th>
                  <th class="py-3 px-2 text-right">Earned</th>
                  <th class="py-3 px-2 text-right">Possible</th>
                  <th class="py-3 px-2 text-right">Score %</th>
                  <th class="py-3 px-2 text-right">What-If Override</th>
                  <th class="py-3 pr-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100 text-xs">
                ${sortedAssignments.length > 0
                  ? sortedAssignments.map(a => renderAssignmentRowHtml(cls, a, true)).join('')
                  : `<tr><td colspan="7" class="py-8 text-center text-xs text-slate-400">No assignments match the active filter.</td></tr>`
                }
              </tbody>
            </table>
          </div>
        `;
        return;
      }

      // Grouped Sections View (Sorted by Assignment Group)
      const groupsToRender = filterGroupId === 'ALL'
        ? cls.groups
        : cls.groups.filter(g => g.id === filterGroupId);

      container.innerHTML = groupsToRender.map(g => {
        const groupAssignments = filtered.filter(a => a.groupId === g.id);

        return `
          <div class="border border-slate-200 rounded-2xl overflow-hidden">
            <div class="px-4 py-3 bg-slate-50/80 border-b border-slate-200 flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2.5">
                <span class="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                <h3 class="text-sm font-bold text-slate-900">${escapeHtml(g.name)}</h3>
                <span class="px-2 py-0.5 rounded-full text-[11px] font-mono font-semibold bg-indigo-50 text-indigo-700 border border-indigo-200">
                  Weight: ${formatCleanPts(g.weight)}%
                </span>
                <span id="sectionGroupSummary_${escapeHtml(g.id)}" class="text-xs font-mono text-slate-500"></span>
              </div>

              <div class="flex items-center gap-1.5">
                <button
                  type="button"
                  data-action="add-assign-to-group"
                  data-group-id="${escapeHtml(g.id)}"
                  data-is-forecast="false"
                  class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-white hover:bg-slate-100 text-slate-700 border border-slate-200 transition"
                >
                  <i class="fa-solid fa-plus text-indigo-500"></i>
                  <span>Add Entry</span>
                </button>
                <button
                  type="button"
                  data-action="add-assign-to-group"
                  data-group-id="${escapeHtml(g.id)}"
                  data-is-forecast="true"
                  class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[11px] font-semibold bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 transition"
                >
                  <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i>
                  <span>+ Forecast</span>
                </button>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b border-slate-100 text-[10px] font-bold uppercase tracking-wider text-slate-400">
                    <th class="py-2 pl-3">Entry Name</th>
                    <th class="py-2 px-2">Group</th>
                    <th class="py-2 px-2 text-right">Earned</th>
                    <th class="py-2 px-2 text-right">Possible</th>
                    <th class="py-2 px-2 text-right">Score %</th>
                    <th class="py-2 px-2 text-right">What-If Score</th>
                    <th class="py-2 pr-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100 text-xs">
                  ${groupAssignments.length > 0
                    ? groupAssignments.map(a => renderAssignmentRowHtml(cls, a, false)).join('')
                    : `<tr><td colspan="7" class="py-5 text-center text-xs text-slate-400">No assignments in "${escapeHtml(g.name)}" yet. Click "+ Add Entry" above.</td></tr>`
                  }
                </tbody>
              </table>
            </div>
          </div>
        `;
      }).join('');
    }

    function updateSummaryAndComputedViews() {
      const cls = getActiveClass();
      if (!cls) return;

      const stats = computeClassGrades(cls);

      // 1. Calculation Mode Buttons
      const normBtn = document.getElementById('modeNormalizeBtn');
      const absBtn = document.getElementById('modeAbsoluteBtn');
      if (normBtn && absBtn) {
        if (cls.calculationMode !== 'absolute') {
          normBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow-xs transition';
          absBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition';
        } else {
          absBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-bold bg-indigo-600 text-white shadow-xs transition';
          normBtn.className = 'px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-600 hover:text-slate-900 transition';
        }
      }

      // 2. Actual Grade Card
      const actualPctEl = document.getElementById('actualPercentageDisplay');
      const actualLetterEl = document.getElementById('actualLetterBadge');
      const actualWeightBadge = document.getElementById('actualActiveWeightBadge');
      const actualPtsSummary = document.getElementById('actualPointsSummary');
      const actualDeltaBox = document.getElementById('actualBucketDeltaBox');

      if (actualWeightBadge) {
        actualWeightBadge.textContent = `${formatCleanPts(stats.actualGradedWeight)}% weight graded`;
      }

      if (actualPctEl && actualLetterEl) {
        if (stats.overallActualPct !== null) {
          actualPctEl.textContent = `${stats.overallActualPct.toFixed(2)}%`;
          const curLetter = stats.actualBucketInfo.current ? stats.actualBucketInfo.current.letter : '-';
          actualLetterEl.textContent = curLetter;
          actualLetterEl.className = `inline-flex items-center justify-center min-w-[64px] h-16 px-4 rounded-2xl text-3xl font-extrabold border shadow-sm ${getLetterBadgeStyle(curLetter)}`;
        } else {
          actualPctEl.textContent = '--%';
          actualLetterEl.textContent = '-';
          actualLetterEl.className = `inline-flex items-center justify-center min-w-[64px] h-16 px-4 rounded-2xl text-3xl font-extrabold border shadow-sm ${getLetterBadgeStyle(null)}`;
        }
      }

      if (actualPtsSummary) {
        actualPtsSummary.textContent = `${formatCleanPts(stats.totalActualEarnedPts)} / ${formatCleanPts(stats.totalActualAvailPts)} raw points across graded entries`;
      }

      if (actualDeltaBox) {
        if (stats.overallActualPct === null || !stats.actualBucketInfo.current) {
          actualDeltaBox.innerHTML = `<span class="text-slate-400">Add graded assignments to see letter bucket margins.</span>`;
        } else {
          const { current, nextHigher, nextLower } = stats.actualBucketInfo;
          const lines = [];
          if (nextHigher) {
            const needed = Math.max(0, Number(nextHigher.min) - stats.overallActualPct);
            lines.push(`<div class="flex items-center justify-between text-slate-600"><span>To reach <strong class="text-emerald-500">${escapeHtml(nextHigher.letter)}</strong> (&ge;${formatCleanPts(nextHigher.min)}%):</span><span class="font-mono font-semibold text-emerald-500">+${needed.toFixed(2)}%</span></div>`);
          } else {
            lines.push(`<div class="text-emerald-500 font-semibold"><i class="fa-solid fa-crown mr-1"></i>Highest grade bucket (${escapeHtml(current.letter)}) achieved!</div>`);
          }
          if (nextLower) {
            const cushion = Math.max(0, stats.overallActualPct - Number(current.min));
            lines.push(`<div class="flex items-center justify-between text-slate-500"><span>Buffer above <strong class="text-slate-700">${escapeHtml(nextLower.letter)}</strong> (&lt;${formatCleanPts(current.min)}%):</span><span class="font-mono font-semibold">+${cushion.toFixed(2)}%</span></div>`);
          }
          actualDeltaBox.innerHTML = lines.join('');
        }
      }

      // 3. Forecast / What-If Grade Card
      const forecastPctEl = document.getElementById('forecastPercentageDisplay');
      const forecastLetterEl = document.getElementById('forecastLetterBadge');
      const forecastDeltaBadge = document.getElementById('forecastDeltaBadge');
      const forecastCountLabel = document.getElementById('forecastCountLabel');
      const forecastBucketDeltaBox = document.getElementById('forecastBucketDeltaBox');

      if (forecastCountLabel) {
        forecastCountLabel.textContent = `${stats.activeForecastEntryCount} active forecast / what-if item(s)`;
      }

      if (forecastPctEl && forecastLetterEl) {
        if (stats.overallForecastPct !== null) {
          forecastPctEl.textContent = `${stats.overallForecastPct.toFixed(2)}%`;
          const fLetter = stats.forecastBucketInfo.current ? stats.forecastBucketInfo.current.letter : '-';
          forecastLetterEl.textContent = fLetter;
        } else {
          forecastPctEl.textContent = '--%';
          forecastLetterEl.textContent = '-';
        }
      }

      if (forecastDeltaBadge) {
        if (stats.overallActualPct !== null && stats.overallForecastPct !== null) {
          const diff = stats.overallForecastPct - stats.overallActualPct;
          if (Math.abs(diff) < 0.005) {
            forecastDeltaBadge.textContent = 'Matches Actual';
          } else {
            const sign = diff > 0 ? '+' : '';
            forecastDeltaBadge.textContent = `${sign}${diff.toFixed(2)}% vs Actual`;
          }
        } else {
          forecastDeltaBadge.textContent = 'Projected';
        }
      }

      if (forecastBucketDeltaBox) {
        if (stats.overallForecastPct !== null && stats.forecastBucketInfo.nextHigher) {
          const nh = stats.forecastBucketInfo.nextHigher;
          const gap = Math.max(0, Number(nh.min) - stats.overallForecastPct);
          forecastBucketDeltaBox.innerHTML = `Projected margin to <strong>${escapeHtml(nh.letter)}</strong> (&ge;${formatCleanPts(nh.min)}%): <span class="font-mono font-bold text-amber-300">+${gap.toFixed(2)}%</span>`;
        } else if (stats.overallForecastPct !== null && stats.forecastBucketInfo.current) {
          forecastBucketDeltaBox.innerHTML = `Projected to finish in top bucket: <strong class="text-emerald-300">${escapeHtml(stats.forecastBucketInfo.current.letter)}</strong>`;
        } else {
          forecastBucketDeltaBox.innerHTML = `Add a forecast entry or What-If score to simulate.`;
        }
      }

      // 4. Target Grade Forecaster Card
      const targetSelect = document.getElementById('targetBucketSelect');
      const targetResultBox = document.getElementById('targetResultBox');
      const sortedBuckets = getSortedBuckets(cls);

      if (targetSelect) {
        targetSelect.innerHTML = sortedBuckets.map(b =>
          `<option value="${escapeHtml(b.letter)}" ${b.letter === cls.targetLetter ? 'selected' : ''}>${escapeHtml(b.letter)} (&ge; ${formatCleanPts(b.min)}%)</option>`
        ).join('');
      }

      if (targetResultBox && sortedBuckets.length > 0) {
        const targetBucket = sortedBuckets.find(b => b.letter === cls.targetLetter) || sortedBuckets[0];
        const targetMin = Number(targetBucket.min);
        const remainingWeight = Math.max(0, stats.totalConfiguredWeight - stats.actualGradedWeight);

        if (remainingWeight <= 0.001) {
          const achieved = (stats.overallActualPct ?? 0) >= targetMin;
          targetResultBox.innerHTML = achieved
            ? `<div class="text-emerald-500 font-bold"><i class="fa-solid fa-circle-check mr-1"></i>All course weight is graded and you met ${escapeHtml(targetBucket.letter)}!</div>`
            : `<div class="text-rose-500 font-semibold"><i class="fa-solid fa-circle-info mr-1"></i>100% of syllabus weight is graded. Final grade is ${formatNum(stats.overallActualPct, 2)}%.</div>`;
        } else {
          // Required average across remaining ungraded weight:
          // (actualWeightedSum + (requiredAvg / 100) * remainingWeight) / (totalConfiguredWeight / 100) = targetMin
          const targetTotalWeighted = targetMin * (stats.totalConfiguredWeight / 100);
          const neededWeighted = targetTotalWeighted - stats.actualWeightedSum;
          const requiredAvgPct = (neededWeighted / (remainingWeight / 100));

          if (requiredAvgPct <= 0) {
            targetResultBox.innerHTML = `<div class="text-emerald-500 font-bold"><i class="fa-solid fa-shield-check mr-1"></i>Locked in! Even 0% on remaining ${formatCleanPts(remainingWeight)}% weight secures ${escapeHtml(targetBucket.letter)}.</div>`;
          } else if (requiredAvgPct > 100) {
            targetResultBox.innerHTML = `
              <div class="text-amber-500 font-semibold">Need <span class="font-mono font-bold">${requiredAvgPct.toFixed(2)}%</span> average across remaining <strong>${formatCleanPts(remainingWeight)}%</strong> weight.</div>
              <div class="text-[11px] text-slate-500">Exceeds 100% unless extra credit is available.</div>
            `;
          } else {
            targetResultBox.innerHTML = `
              <div class="text-slate-700">Need <span class="font-mono font-extrabold text-indigo-500 text-sm">${requiredAvgPct.toFixed(2)}%</span> average across remaining <strong>${formatCleanPts(remainingWeight)}%</strong> ungraded weight to earn <strong>${escapeHtml(targetBucket.letter)}</strong>.</div>
            `;
          }
        }
      }

      // 5. Group Contribution Stacked Bar
      const totalWeightLabel = document.getElementById('totalWeightConfiguredLabel');
      const barEl = document.getElementById('groupContributionBar');
      if (totalWeightLabel) totalWeightLabel.textContent = `${formatCleanPts(stats.totalConfiguredWeight)}% total`;
      if (barEl) {
        const barColors = ['bg-indigo-500', 'bg-emerald-500', 'bg-amber-500', 'bg-violet-500', 'bg-sky-500', 'bg-rose-500'];
        const denom = Math.max(100, stats.totalConfiguredWeight);
        barEl.innerHTML = cls.groups.map((g, i) => {
          const st = stats.groupStats[g.id];
          const earnedShare = st && st.actualPct !== null ? ((st.actualPct / 100) * st.weight) / denom * 100 : 0;
          const color = barColors[i % barColors.length];
          return `<div style="width: ${Math.max(0, earnedShare)}%" class="${color} h-full transition-all duration-300" title="${escapeHtml(g.name)}: +${earnedShare.toFixed(1)}% earned"></div>`;
        }).join('');
      }

      // 6. Update Assignment Groups Table & Section Headers
      const weightWarningPill = document.getElementById('weightWarningPill');
      const normalizeBtn = document.getElementById('btnNormalizeWeightsTo100');
      const weightMismatch = Math.abs(stats.totalConfiguredWeight - 100) > 0.05;

      if (weightWarningPill) {
        weightWarningPill.classList.toggle('hidden', !weightMismatch);
        weightWarningPill.textContent = `Weights = ${formatCleanPts(stats.totalConfiguredWeight)}%`;
      }
      if (normalizeBtn) {
        normalizeBtn.classList.toggle('hidden', !weightMismatch || stats.totalConfiguredWeight <= 0);
      }

      cls.groups.forEach(g => {
        const st = stats.groupStats[g.id];
        if (!st) return;

        const ptsCell = document.getElementById(`groupPtsCell_${g.id}`);
        const actCell = document.getElementById(`groupActualCell_${g.id}`);
        const fcCell = document.getElementById(`groupForecastCell_${g.id}`);
        const secSummary = document.getElementById(`sectionGroupSummary_${g.id}`);

        if (ptsCell) ptsCell.textContent = `${formatCleanPts(st.actualEarned)} / ${formatCleanPts(st.actualAvailable)}`;
        if (actCell) actCell.textContent = st.actualPct !== null ? `${st.actualPct.toFixed(2)}%` : '--%';
        if (fcCell) fcCell.textContent = st.forecastPct !== null ? `${st.forecastPct.toFixed(2)}%` : '--%';
        if (secSummary) {
          const actTxt = st.actualPct !== null ? `${st.actualPct.toFixed(1)}%` : 'Ungraded';
          secSummary.textContent = `• ${formatCleanPts(st.actualEarned)}/${formatCleanPts(st.actualAvailable)} pts (${actTxt})`;
        }
      });

      const footerWeightCell = document.getElementById('groupsTotalWeightCell');
      const footerPtsCell = document.getElementById('groupsTotalPointsCell');
      const footerActCell = document.getElementById('groupsFooterActualPct');
      const footerFcCell = document.getElementById('groupsFooterForecastPct');

      if (footerWeightCell) {
        footerWeightCell.textContent = `${formatCleanPts(stats.totalConfiguredWeight)}%`;
        footerWeightCell.className = `py-3 text-right font-mono ${weightMismatch ? 'text-amber-500 font-bold' : 'text-emerald-500 font-bold'}`;
      }
      if (footerPtsCell) footerPtsCell.textContent = `${formatCleanPts(stats.totalActualEarnedPts)} / ${formatCleanPts(stats.totalActualAvailPts)} pts`;
      if (footerActCell) footerActCell.textContent = stats.overallActualPct !== null ? `${stats.overallActualPct.toFixed(2)}%` : '--%';
      if (footerFcCell) footerFcCell.textContent = stats.overallForecastPct !== null ? `${stats.overallForecastPct.toFixed(2)}%` : '--%';

      // 7. Highlight Active Buckets
      cls.buckets.forEach(b => {
        const statusCell = document.getElementById(`bucketStatusCell_${b.id}`);
        if (!statusCell) return;
        const isActualMatch = stats.actualBucketInfo.current && stats.actualBucketInfo.current.id === b.id;
        const isForecastMatch = stats.forecastBucketInfo.current && stats.forecastBucketInfo.current.id === b.id;

        const badges = [];
        if (isActualMatch) badges.push(`<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-indigo-600 text-white">Actual</span>`);
        if (isForecastMatch && !isActualMatch) badges.push(`<span class="px-1.5 py-0.5 rounded text-[10px] font-bold bg-amber-500 text-slate-950">Forecast</span>`);
        statusCell.innerHTML = badges.join(' ');
      });

      // 8. Refresh Inline Assignment Score Pills
      cls.assignments.forEach(a => {
        const pill = document.getElementById(`assignPctPill_${a.id}`);
        const effEl = document.getElementById(`assignEffPct_${a.id}`);
        const pct = a.available > 0 ? (a.earned / a.available) * 100 : 0;
        const hasWhatIf = a.whatIfEarned !== null && a.whatIfEarned !== '' && !isNaN(Number(a.whatIfEarned));

        if (pill) {
          pill.textContent = `${formatNum(pct, 1)}%`;
          pill.className = `inline-block px-2 py-0.5 rounded-md font-mono text-[11px] font-bold ${getScorePillColor(pct)}`;
        }
        if (effEl) {
          if (hasWhatIf && a.available > 0) {
            const effPct = (Number(a.whatIfEarned) / a.available) * 100;
            effEl.textContent = `Proj: ${formatNum(effPct, 1)}%`;
            effEl.classList.remove('hidden');
          } else {
            effEl.classList.add('hidden');
          }
        }
      });

      renderClassTabs();
    }

    function renderAll() {
      applyTheme(appState.theme || 'black');
      applyLocaleCascade(appState.locale || 'en');
      renderTopNavigation();

      if (appState.activeView === 'profile') {
        renderProfilePage();
      } else {
        renderClassTabs();
        renderGradebookView();
      }
    }

    /*************************************************************************
     * 8. EVENT BINDINGS (100% NULL-SAFE)
     *************************************************************************/
    function bindGradebookEvents() {
      const cls = getActiveClass();
      if (!cls) return;

      document.getElementById('activeClassNameInput')?.addEventListener('input', (e) => {
        cls.name = e.target.value;
        saveState();
        renderClassTabs();
      });

      document.getElementById('activeClassTermInput')?.addEventListener('input', (e) => {
        cls.term = e.target.value;
        saveState();
      });

      document.getElementById('modeNormalizeBtn')?.addEventListener('click', () => {
        cls.calculationMode = 'normalized';
        saveState();
        updateSummaryAndComputedViews();
      });

      document.getElementById('modeAbsoluteBtn')?.addEventListener('click', () => {
        cls.calculationMode = 'absolute';
        saveState();
        updateSummaryAndComputedViews();
      });

      document.getElementById('btnDuplicateClass')?.addEventListener('click', () => {
        const clone = JSON.parse(JSON.stringify(cls));
        clone.id = uid('cls');
        clone.name = `${cls.name} (Copy)`;
        appState.classes.push(clone);
        appState.activeClassId = clone.id;
        saveState();
        renderAll();
        showToast(`Duplicated "${cls.name}"`, 'success');
      });

      document.getElementById('btnDeleteClass')?.addEventListener('click', () => {
        if (appState.classes.length <= 1) {
          showToast('You must keep at least one class tab.', 'warning');
          return;
        }
        openConfirmModal(
          `Delete "${cls.name}"?`,
          `This will permanently remove "${cls.name}" and its ${cls.assignments.length} assignments. This action cannot be undone.`,
          () => {
            appState.classes = appState.classes.filter(c => c.id !== cls.id);
            appState.activeClassId = appState.classes[0].id;
            saveState();
            renderAll();
            showToast('Class deleted', 'info');
          }
        );
      });

      document.getElementById('targetBucketSelect')?.addEventListener('change', (e) => {
        cls.targetLetter = e.target.value;
        saveState();
        updateSummaryAndComputedViews();
      });

      document.getElementById('btnClearForecasts')?.addEventListener('click', () => {
        cls.assignments = cls.assignments.filter(a => !a.isForecast);
        cls.assignments.forEach(a => { a.whatIfEarned = null; });
        saveState();
        renderGradebook();
        updateSummaryAndComputedViews();
        showToast('Cleared all hypothetical forecasts & what-if overrides', 'info');
      });

      document.getElementById('btnCommitForecasts')?.addEventListener('click', () => {
        cls.assignments.forEach(a => {
          if (a.whatIfEarned !== null && a.whatIfEarned !== '' && !isNaN(Number(a.whatIfEarned))) {
            a.earned = Number(a.whatIfEarned);
            a.whatIfEarned = null;
          }
          if (a.isForecast) {
            a.isForecast = false;
          }
        });
        saveState();
        renderGradebook();
        updateSummaryAndComputedViews();
        showToast('Converted all forecast scores to Actual grades', 'success');
      });

      document.getElementById('btnToggleConfigPanels')?.addEventListener('click', () => {
        appState.configExpanded = !appState.configExpanded;
        const wrapper = document.getElementById('configPanelsWrapper');
        const text = document.getElementById('configToggleText');
        const icon = document.getElementById('configToggleIcon');
        if (wrapper && text && icon) {
          wrapper.classList.toggle('hidden', !appState.configExpanded);
          text.textContent = appState.configExpanded ? 'Hide Configuration' : 'Show Configuration';
          icon.className = appState.configExpanded ? 'fa-solid fa-chevron-up' : 'fa-solid fa-chevron-down';
        }
        saveState();
      });

      // Assignment Groups Table Events
      document.getElementById('assignmentGroupsTableBody')?.addEventListener('input', (e) => {
        const input = e.target;
        const groupId = input.dataset.groupId;
        const field = input.dataset.groupField;
        if (!groupId || !field) return;

        const group = cls.groups.find(g => g.id === groupId);
        if (!group) return;

        if (field === 'name') {
          group.name = input.value;
          syncGroupDropdowns();
          renderGradebook();
        } else if (field === 'weight') {
          group.weight = Math.max(0, parseFloat(input.value) || 0);
          syncGroupDropdowns();
        }
        saveState();
        updateSummaryAndComputedViews();
      });

      document.getElementById('assignmentGroupsTableBody')?.addEventListener('click', (e) => {
        const delBtn = e.target.closest('[data-action="delete-group"]');
        if (!delBtn) return;
        const groupId = delBtn.dataset.groupId;
        if (cls.groups.length <= 1) {
          showToast('Class must have at least one assignment group.', 'warning');
          return;
        }
        const group = cls.groups.find(g => g.id === groupId);
        const affectedCount = cls.assignments.filter(a => a.groupId === groupId).length;
        const fallbackGroup = cls.groups.find(g => g.id !== groupId);

        openConfirmModal(
          `Delete "${group.name}" Group?`,
          affectedCount > 0
            ? `This group contains ${affectedCount} assignment(s). They will be automatically moved to "${fallbackGroup.name}".`
            : `Are you sure you want to remove the "${group.name}" assignment group?`,
          () => {
            cls.assignments.forEach(a => {
              if (a.groupId === groupId) a.groupId = fallbackGroup.id;
            });
            cls.groups = cls.groups.filter(g => g.id !== groupId);
            if (filterGroupId === groupId) filterGroupId = 'ALL';
            saveState();
            renderAll();
            showToast(`Deleted group "${group.name}"`, 'info');
          }
        );
      });

      document.getElementById('btnAddGroup')?.addEventListener('click', () => {
        const currentSum = cls.groups.reduce((acc, g) => acc + (Number(g.weight) || 0), 0);
        const suggestedWeight = currentSum < 100 ? Math.max(0, 100 - currentSum) : 10;
        cls.groups.push({
          id: uid('grp'),
          name: `Category ${cls.groups.length + 1}`,
          weight: Number(suggestedWeight.toFixed(1))
        });
        saveState();
        renderAll();
        showToast('Added new assignment group', 'success');
      });

      document.getElementById('btnNormalizeWeightsTo100')?.addEventListener('click', () => {
        const total = cls.groups.reduce((acc, g) => acc + (Number(g.weight) || 0), 0);
        if (total <= 0) return;
        cls.groups.forEach(g => {
          g.weight = Number(((Number(g.weight) / total) * 100).toFixed(2));
        });
        const newTotal = cls.groups.reduce((acc, g) => acc + g.weight, 0);
        if (cls.groups.length > 0 && Math.abs(100 - newTotal) > 0) {
          cls.groups[cls.groups.length - 1].weight = Number((cls.groups[cls.groups.length - 1].weight + (100 - newTotal)).toFixed(2));
        }
        saveState();
        renderAll();
        showToast('Normalized assignment group weights to 100%', 'success');
      });

      // Grade Buckets Events
      document.getElementById('gradeBucketsTableBody')?.addEventListener('input', (e) => {
        const input = e.target;
        const bucketId = input.dataset.bucketId;
        const field = input.dataset.bucketField;
        if (!bucketId || !field) return;

        const bucket = cls.buckets.find(b => b.id === bucketId);
        if (!bucket) return;

        if (field === 'letter') {
          bucket.letter = input.value.trim() || '?';
        } else if (field === 'min') {
          bucket.min = Math.max(0, Math.min(100, parseFloat(input.value) || 0));
        }
        saveState();
        updateSummaryAndComputedViews();
      });

      document.getElementById('gradeBucketsTableBody')?.addEventListener('change', (e) => {
        if (e.target.dataset.bucketField === 'min') {
          renderConfigPanels();
          updateSummaryAndComputedViews();
        }
      });

      document.getElementById('gradeBucketsTableBody')?.addEventListener('click', (e) => {
        const delBtn = e.target.closest('[data-action="delete-bucket"]');
        if (!delBtn) return;
        const bucketId = delBtn.dataset.bucketId;
        if (cls.buckets.length <= 2) {
          showToast('Keep at least 2 grade buckets.', 'warning');
          return;
        }
        cls.buckets = cls.buckets.filter(b => b.id !== bucketId);
        saveState();
        renderConfigPanels();
        updateSummaryAndComputedViews();
      });

      document.getElementById('btnAddBucket')?.addEventListener('click', () => {
        cls.buckets.push({ id: uid('b'), letter: 'P', min: 65 });
        saveState();
        renderConfigPanels();
        updateSummaryAndComputedViews();
        showToast('Added custom grade bucket', 'success');
      });

      document.getElementById('bucketPresetSelect')?.addEventListener('change', (e) => {
        const presetKey = e.target.value;
        if (!presetKey || !BUCKET_PRESETS[presetKey]) return;
        cls.buckets = JSON.parse(JSON.stringify(BUCKET_PRESETS[presetKey]));
        e.target.value = '';
        saveState();
        renderConfigPanels();
        updateSummaryAndComputedViews();
        showToast('Loaded grade scale preset', 'success');
      });

      // Gradebook View & Filter Controls
      document.getElementById('viewGroupedBtn')?.addEventListener('click', () => {
        appState.viewMode = 'grouped';
        saveState();
        renderGradebook();
        updateSummaryAndComputedViews();
      });

      document.getElementById('viewFlatSortedBtn')?.addEventListener('click', () => {
        appState.viewMode = 'flat';
        saveState();
        renderGradebook();
        updateSummaryAndComputedViews();
      });

      document.getElementById('filterGroupSelect')?.addEventListener('change', (e) => {
        filterGroupId = e.target.value;
        renderGradebook();
        updateSummaryAndComputedViews();
      });

      document.getElementById('filterModeSelect')?.addEventListener('change', (e) => {
        filterMode = e.target.value;
        renderGradebook();
        updateSummaryAndComputedViews();
      });

      // Quick Add Assignment
      function handleQuickAddAssignment(isForecastMode) {
        const nameInput = document.getElementById('newAssignName');
        const groupSelect = document.getElementById('newAssignGroup');
        const earnedInput = document.getElementById('newAssignEarned');
        const availInput = document.getElementById('newAssignAvailable');
        if (!nameInput || !groupSelect || !earnedInput || !availInput) return;

        const name = nameInput.value.trim() || (isForecastMode ? `Forecast Entry ${cls.assignments.length + 1}` : `Assignment ${cls.assignments.length + 1}`);
        const groupId = groupSelect.value || (cls.groups[0] && cls.groups[0].id);
        const earned = parseFloat(earnedInput.value);
        const available = parseFloat(availInput.value);

        if (isNaN(earned) || isNaN(available) || available <= 0) {
          showToast('Please enter valid numeric Points Earned and Available Points (> 0).', 'warning');
          return;
        }

        const newId = uid('assign');
        cls.assignments.push({
          id: newId,
          name,
          groupId,
          earned,
          available,
          isForecast: isForecastMode,
          whatIfEarned: null
        });

        lastMovedAssignmentId = newId;
        nameInput.value = '';
        earnedInput.value = '';
        availInput.value = '';

        saveState();
        renderGradebook();
        updateSummaryAndComputedViews();
        showToast(`Added "${name}" (${isForecastMode ? 'Forecast' : 'Actual'})`, 'success');
      }

      document.getElementById('quickAddAssignmentForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        handleQuickAddAssignment(false);
      });

      document.getElementById('btnQuickAddForecast')?.addEventListener('click', () => {
        handleQuickAddAssignment(true);
      });

      // Gradebook Container Delegated Events
      const gradebookContainer = document.getElementById('assignmentsGradebookContainer');

      gradebookContainer?.addEventListener('input', (e) => {
        const input = e.target;
        const assignId = input.dataset.assignId;
        const field = input.dataset.assignField;
        if (!assignId || !field || field === 'groupId') return;

        const assign = cls.assignments.find(a => a.id === assignId);
        if (!assign) return;

        if (field === 'name') {
          assign.name = input.value;
        } else if (field === 'earned') {
          assign.earned = parseFloat(input.value) || 0;
        } else if (field === 'available') {
          assign.available = Math.max(0.01, parseFloat(input.value) || 0);
        } else if (field === 'whatIfEarned') {
          const raw = input.value.trim();
          assign.whatIfEarned = raw === '' ? null : parseFloat(raw);
        }

        saveState();
        updateSummaryAndComputedViews();
      });

      gradebookContainer?.addEventListener('change', (e) => {
        const select = e.target;
        if (select.dataset.assignField !== 'groupId') return;
        const assignId = select.dataset.assignId;
        const assign = cls.assignments.find(a => a.id === assignId);
        if (!assign) return;

        assign.groupId = select.value;
        lastMovedAssignmentId = assignId;
        const targetGroup = cls.groups.find(g => g.id === select.value);

        saveState();
        renderGradebook();
        updateSummaryAndComputedViews();
        if (targetGroup) {
          showToast(`Moved "${assign.name}" to ${targetGroup.name}`, 'info');
        }
      });

      gradebookContainer?.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action]');
        if (!btn) return;
        const action = btn.dataset.action;

        if (action === 'toggle-assign-forecast') {
          const assign = cls.assignments.find(a => a.id === btn.dataset.assignId);
          if (!assign) return;
          assign.isForecast = !assign.isForecast;
          if (assign.isForecast) assign.whatIfEarned = null;
          saveState();
          renderGradebook();
          updateSummaryAndComputedViews();
        } else if (action === 'clear-whatif') {
          const assign = cls.assignments.find(a => a.id === btn.dataset.assignId);
          if (!assign) return;
          assign.whatIfEarned = null;
          saveState();
          renderGradebook();
          updateSummaryAndComputedViews();
        } else if (action === 'duplicate-assign') {
          const assign = cls.assignments.find(a => a.id === btn.dataset.assignId);
          if (!assign) return;
          const copyId = uid('assign');
          const idx = cls.assignments.findIndex(a => a.id === assign.id);
          const clone = { ...assign, id: copyId, name: `${assign.name} (Copy)` };
          cls.assignments.splice(idx + 1, 0, clone);
          lastMovedAssignmentId = copyId;
          saveState();
          renderGradebook();
          updateSummaryAndComputedViews();
        } else if (action === 'delete-assign') {
          cls.assignments = cls.assignments.filter(a => a.id !== btn.dataset.assignId);
          saveState();
          renderGradebook();
          updateSummaryAndComputedViews();
        } else if (action === 'add-assign-to-group') {
          const groupId = btn.dataset.groupId;
          const isForecast = btn.dataset.isForecast === 'true';
          const group = cls.groups.find(g => g.id === groupId);
          const newId = uid('assign');
          cls.assignments.push({
            id: newId,
            name: isForecast ? `Upcoming ${group ? group.name : 'Assignment'}` : `${group ? group.name : 'Assignment'} #${cls.assignments.filter(a => a.groupId === groupId).length + 1}`,
            groupId,
            earned: 90,
            available: 100,
            isForecast,
            whatIfEarned: null
          });
          lastMovedAssignmentId = newId;
          saveState();
          renderGradebook();
          updateSummaryAndComputedViews();
        }
      });
    }

    function initGlobalEventListeners() {
      // Top Navigation: Gradebook vs Profile & Settings
      document.getElementById('btnNavGradebook')?.addEventListener('click', () => {
        if (appState.activeView !== 'gradebook') {
          appState.activeView = 'gradebook';
          saveState();
          renderAll();
        }
      });

      document.getElementById('btnNavProfile')?.addEventListener('click', () => {
        if (appState.activeView !== 'profile') {
          appState.activeView = 'profile';
          saveState();
          renderAll();
        }
      });

      // Class Tab Switching
      document.getElementById('classTabsContainer')?.addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-action="switch-class"]');
        if (!btn) return;
        const targetId = btn.dataset.classId;
        if (targetId && (targetId !== appState.activeClassId || appState.activeView !== 'gradebook')) {
          appState.activeView = 'gradebook';
          appState.activeClassId = targetId;
          filterGroupId = 'ALL';
          saveState();
          renderAll();
        }
      });

      // Add New Class
      document.getElementById('btnAddClass')?.addEventListener('click', () => {
        const newClassId = uid('cls');
        const g1 = uid('grp');
        const g2 = uid('grp');
        const g3 = uid('grp');

        const newCls = {
          id: newClassId,
          name: `New Course ${appState.classes.length + 1}`,
          term: 'Fall 2026',
          calculationMode: 'normalized',
          targetLetter: 'A',
          groups: [
            { id: g1, name: 'Homework & Labs', weight: 30 },
            { id: g2, name: 'Midterm Exam', weight: 30 },
            { id: g3, name: 'Final Exam', weight: 40 }
          ],
          buckets: JSON.parse(JSON.stringify(BUCKET_PRESETS.standard_plus_minus)),
          assignments: [
            { id: uid('a'), name: 'Homework 1', groupId: g1, earned: 95, available: 100, isForecast: false, whatIfEarned: null },
            { id: uid('a'), name: 'Midterm Exam', groupId: g2, earned: 88, available: 100, isForecast: false, whatIfEarned: null },
            { id: uid('a'), name: 'Final Exam (Forecast)', groupId: g3, earned: 92, available: 100, isForecast: true, whatIfEarned: null }
          ]
        };

        appState.classes.push(newCls);
        appState.activeView = 'gradebook';
        appState.activeClassId = newClassId;
        filterGroupId = 'ALL';
        saveState();
        renderAll();
        showToast('Added new class gradebook', 'success');
      });

      // Confirmation Modal Buttons
      document.getElementById('confirmModalCancelBtn')?.addEventListener('click', closeConfirmModal);
      document.getElementById('confirmModalAcceptBtn')?.addEventListener('click', () => {
        if (typeof pendingConfirmCallback === 'function') {
          pendingConfirmCallback();
        }
        closeConfirmModal();
      });
    }

    // Boot Application on DOM Load
    window.addEventListener('DOMContentLoaded', () => {
      initGlobalEventListeners();
      renderAll();
    });
  </script>
</body>
</html>
