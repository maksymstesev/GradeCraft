      function bindProfileEvents() {
        // Student Profile Inputs
        document.getElementById('profileDisplayName')?.addEventListener('input', (e) => {
          state.profile.displayName = e.target.value;
          saveState();
          const initials = getInitials(state.profile.displayName);
          const avatarEl = document.getElementById('profileAvatarCircle');
          const headerAvatarEl = document.getElementById('headerAvatarInitials');
          if (avatarEl) avatarEl.textContent = initials;
          if (headerAvatarEl) headerAvatarEl.textContent = initials;
        });

        document.getElementById('profileEmail')?.addEventListener('input', (e) => {
          state.profile.email = e.target.value;
          saveState();
        });

        document.getElementById('profileInstitution')?.addEventListener('input', (e) => {
          state.profile.institution = e.target.value;
          saveState();
        });

        document.getElementById('profileStudentId')?.addEventListener('input', (e) => {
          state.profile.studentId = e.target.value;
          saveState();
        });

        // Theme Switcher
        document.querySelectorAll('[data-action="set-theme"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const themeVal = btn.getAttribute('data-theme-value');
            applyTheme(themeVal);
            saveState();
            renderApp();
            showToast(`Switched theme to ${themeVal}`, 'info');
          });
        });

        // Locale Cascade Selector
        document.getElementById('selectLocaleCascade')?.addEventListener('change', (e) => {
          applyLocale(e.target.value);
          saveState();
          renderApp();
          showToast(`Locale cascade set to ${state.locale}`, 'info');
        });

        // Custom Grade Definitions Cutoffs
        document.getElementById('tbodyDefaultGradeDefinitions')?.addEventListener('input', (e) => {
          const input = e.target;
          const id = input.getAttribute('data-default-grade-id');
          if (!id) return;
          const def = state.defaultGradeDefinitions.find(d => d.id === id);
          if (!def) return;
          def.min = Math.max(0, Math.min(100, parseFloat(input.value) || 0));
          saveState();
        });

        document.getElementById('btnSaveDefaultDefinitions')?.addEventListener('click', () => {
          saveState();
          showToast('Saved default grade definitions', 'success');
        });

        document.getElementById('btnApplyDefaultsToAllClasses')?.addEventListener('click', () => {
          state.classes.forEach(c => {
            c.buckets = cloneGradeScale(state.defaultGradeDefinitions);
          });
          saveState();
          showToast('Applied default grade definitions to all classes', 'success');
        });

        document.getElementById('btnResetUcbDefaults')?.addEventListener('click', () => {
          state.defaultGradeDefinitions = cloneGradeScale(UC_BERKELEY_GRADE_DEFINITIONS);
          saveState();
          renderApp();
          showToast('Reset to UC Berkeley Registrar defaults', 'success');
        });

        // Export JSON
        document.getElementById('btnExportJson')?.addEventListener('click', () => {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'gradecraft-data.json';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);
          showToast('Downloaded gradecraft-data.json', 'success');
        });

        // Import JSON
        document.getElementById('inputImportJson')?.addEventListener('change', (e) => {
          const file = e.target.files && e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (ev) => {
            try {
              const parsed = JSON.parse(ev.target.result);
              if (!parsed || !Array.isArray(parsed.classes) || parsed.classes.length === 0) {
                showToast('Invalid JSON backup: missing classes list.', 'warning');
                return;
              }
              if (!['black', 'midnight', 'light'].includes(parsed.theme)) parsed.theme = state.theme;
              if (!parsed.locale) parsed.locale = state.locale;
              if (!parsed.profile) parsed.profile = state.profile;
              if (!Array.isArray(parsed.defaultGradeDefinitions) || parsed.defaultGradeDefinitions.length === 0) {
                parsed.defaultGradeDefinitions = cloneGradeScale(UC_BERKELEY_GRADE_DEFINITIONS);
              }
              state = parsed;
              saveState();
              renderApp();
              showToast('Imported JSON data successfully', 'success');
            } catch {
              showToast('Failed to parse JSON file.', 'warning');
            }
          };
          reader.readAsText(file);
          e.target.value = '';
        });

        // Reset Demo Data
        document.getElementById('btnResetDemoData')?.addEventListener('click', () => {
          openConfirmModal(
            'Reset Demo Data?',
            'This will restore the default sample courses (CS 101 and DATA 100), generic profile defaults, and UC Berkeley grade definitions.',
            () => {
              const keepTheme = state.theme;
              const keepLocale = state.locale;
              state = createDefaultState();
              state.theme = keepTheme;
              state.locale = keepLocale;
              state.activeView = 'profile';
              saveState();
              renderApp();
              showToast('Restored default demo data', 'success');
            }
          );
        });
      }

      /*************************************************************************
       * 9. MAIN RENDER ORCHESTRATOR & GLOBAL LISTENERS
       *************************************************************************/
      function renderApp(preserveScroll = true) {
        const prevScrollY = window.scrollY;
        applyTheme(state.theme);
        applyLocale(state.locale);
        renderHeaderNavigation();

        const root = document.getElementById('mainWorkspace');
        if (!root) return;

        if (state.activeView === 'profile') {
          renderProfileView(root);
        } else {
          renderGradebookView(root);
        }

        if (preserveScroll) {
          window.scrollTo({ top: prevScrollY, behavior: 'instant' });
        }
      }

      function initGlobalListeners() {
        // Brand Reload Button
        document.getElementById('btnBrandReload')?.addEventListener('click', () => {
          window.location.reload();
        });

        // Top Navigation Pills
        document.getElementById('navGradebookBtn')?.addEventListener('click', () => {
          if (state.activeView !== 'gradebook') {
            state.activeView = 'gradebook';
            saveState();
            renderApp();
          }
        });

        document.getElementById('navProfileBtn')?.addEventListener('click', () => {
          if (state.activeView !== 'profile') {
            state.activeView = 'profile';
            saveState();
            renderApp();
          }
        });

        // Modal Buttons
        document.getElementById('confirmModalCancelBtn')?.addEventListener('click', closeConfirmModal);
        document.getElementById('confirmModalAcceptBtn')?.addEventListener('click', () => {
          if (typeof pendingModalConfirm === 'function') {
            pendingModalConfirm();
          }
          closeConfirmModal();
        });
      }

      window.addEventListener('DOMContentLoaded', () => {
        initGlobalListeners();
        renderApp();
      });
    })();
  </script>
