<!DOCTYPE html>
<html lang="en" data-theme="black" class="h-full antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GradeCraft — Class Grade Calculator & Forecaster</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    };
  </script>

  <style>
    /* Theme Tokens: Light, Midnight Slate, and True Black OLED (Default) */
    :root,
    html[data-theme="light"] {
      --bg-canvas: #f8fafc;
      --bg-surface: #ffffff;
      --bg-surface-hover: #f8fafc;
      --bg-elevated: #f1f5f9;
      --bg-subtle: #f8fafc;
      --bg-input: #ffffff;
      --border-primary: #e2e8f0;
      --border-subtle: #f1f5f9;
      --border-input: #cbd5e1;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --text-faint: #94a3b8;
      --card-shadow: 0 1px 3px 0 rgba(15, 23, 42, 0.06);
      --scroll-track: #f1f5f9;
      --scroll-thumb: #cbd5e1;
      --scroll-thumb-hover: #94a3b8;
    }

    html[data-theme="midnight"] {
      color-scheme: dark;
      --bg-canvas: #090d16;
      --bg-surface: #111827;
      --bg-surface-hover: #172033;
      --bg-elevated: #1e293b;
      --bg-subtle: #0f172a;
      --bg-input: #0b1120;
      --border-primary: #1f2937;
      --border-subtle: #182234;
      --border-input: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #e2e8f0;
      --text-muted: #94a3b8;
      --text-faint: #64748b;
      --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.5), inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
      --scroll-track: #090d16;
      --scroll-thumb: #334155;
      --scroll-thumb-hover: #475569;
    }

    html[data-theme="black"] {
      color-scheme: dark;
      --bg-canvas: #000000;
      --bg-surface: #09090b;
      --bg-surface-hover: #121217;
      --bg-elevated: #141419;
      --bg-subtle: #0c0c10;
      --bg-input: #050507;
      --border-primary: #1e1e24;
      --border-subtle: #141419;
      --border-input: #272730;
      --text-primary: #fafafa;
      --text-secondary: #d4d4d8;
      --text-muted: #a1a1aa;
      --text-faint: #71717a;
      --card-shadow: 0 8px 28px -4px rgba(0, 0, 0, 0.85), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
      --scroll-track: #050507;
      --scroll-thumb: #27272a;
      --scroll-thumb-hover: #3f3f46;
    }

    /* Dark / Black Theme Surface & Typography Overrides */
    html[data-theme="black"] body,
    html[data-theme="midnight"] body {
      background-color: var(--bg-canvas) !important;
      color: var(--text-primary) !important;
      background-image: radial-gradient(ellipse 80% 35% at 50% -8%, rgba(99, 102, 241, 0.13), transparent);
      background-attachment: fixed;
    }

    html[data-theme="black"] header {
      background-color: rgba(9, 9, 11, 0.9) !important;
      border-color: var(--border-primary) !important;
    }

    html[data-theme="midnight"] header {
      background-color: rgba(15, 23, 42, 0.9) !important;
      border-color: var(--border-primary) !important;
    }

    html[data-theme="black"] .bg-white,
    html[data-theme="midnight"] .bg-white {
      background-color: var(--bg-surface) !important;
      box-shadow: var(--card-shadow);
    }

    html[data-theme="black"] .bg-slate-50,
    html[data-theme="black"] .bg-slate-50\/50,
    html[data-theme="black"] .bg-slate-50\/60,
    html[data-theme="black"] .bg-slate-50\/80,
    html[data-theme="midnight"] .bg-slate-50,
    html[data-theme="midnight"] .bg-slate-50\/50,
    html[data-theme="midnight"] .bg-slate-50\/60,
    html[data-theme="midnight"] .bg-slate-50\/80 {
      background-color: var(--bg-subtle) !important;
    }

    html[data-theme="black"] .bg-slate-100,
    html[data-theme="black"] .bg-slate-100\/80,
    html[data-theme="black"] .bg-slate-200\/70,
    html[data-theme="black"] .bg-slate-200\/80,
    html[data-theme="midnight"] .bg-slate-100,
    html[data-theme="midnight"] .bg-slate-100\/80,
    html[data-theme="midnight"] .bg-slate-200\/70,
    html[data-theme="midnight"] .bg-slate-200\/80 {
      background-color: var(--bg-elevated) !important;
    }

    /* Borders & Dividers in Black/Midnight Mode */
    html[data-theme="black"] .border-slate-200,
    html[data-theme="black"] .border-slate-200\/90,
    html[data-theme="black"] .border-slate-200\/80,
    html[data-theme="black"] .border-slate-200\/70,
    html[data-theme="black"] .border-slate-200\/60,
    html[data-theme="black"] .border-slate-300,
    html[data-theme="midnight"] .border-slate-200,
    html[data-theme="midnight"] .border-slate-200\/90,
    html[data-theme="midnight"] .border-slate-200\/80,
    html[data-theme="midnight"] .border-slate-200\/70,
    html[data-theme="midnight"] .border-slate-200\/60,
    html[data-theme="midnight"] .border-slate-300 {
      border-color: var(--border-primary) !important;
    }

    html[data-theme="black"] .border-slate-100,
    html[data-theme="black"] .divide-slate-100 > :not([hidden]) ~ :not([hidden]),
    html[data-theme="midnight"] .border-slate-100,
    html[data-theme="midnight"] .divide-slate-100 > :not([hidden]) ~ :not([hidden]) {
      border-color: var(--border-subtle) !important;
    }

    html[data-theme="black"] .border-indigo-100,
    html[data-theme="midnight"] .border-indigo-100 {
      border-color: rgba(99, 102, 241, 0.22) !important;
    }

    /* Text Contrast in Black/Midnight Mode */
    html[data-theme="black"] .text-slate-900,
    html[data-theme="black"] .text-slate-800,
    html[data-theme="midnight"] .text-slate-900,
    html[data-theme="midnight"] .text-slate-800 {
      color: var(--text-primary) !important;
    }

    html[data-theme="black"] .text-slate-700,
    html[data-theme="black"] .text-slate-600,
    html[data-theme="midnight"] .text-slate-700,
    html[data-theme="midnight"] .text-slate-600 {
      color: var(--text-secondary) !important;
    }

    html[data-theme="black"] .text-slate-500,
    html[data-theme="midnight"] .text-slate-500 {
      color: var(--text-muted) !important;
    }

    html[data-theme="black"] .text-slate-400,
    html[data-theme="midnight"] .text-slate-400 {
      color: var(--text-faint) !important;
    }

    /* Inputs & Selects in Black/Midnight Mode */
    html[data-theme="black"] input:not([id="activeClassNameInput"]),
    html[data-theme="black"] select,
    html[data-theme="midnight"] input:not([id="activeClassNameInput"]),
    html[data-theme="midnight"] select {
      background-color: var(--bg-input) !important;
      border-color: var(--border-input) !important;
      color: var(--text-primary) !important;
    }

    html[data-theme="black"] input:focus:not([id="activeClassNameInput"]),
    html[data-theme="black"] select:focus,
    html[data-theme="midnight"] input:focus:not([id="activeClassNameInput"]),
    html[data-theme="midnight"] select:focus {
      border-color: #6366f1 !important;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25) !important;
    }

    /* Table Row & Button Hovers in Black/Midnight Mode */
    html[data-theme="black"] .hover\:bg-slate-50:hover,
    html[data-theme="black"] .hover\:bg-slate-50\/80:hover,
    html[data-theme="black"] .hover\:bg-slate-50\/90:hover,
    html[data-theme="black"] .hover\:bg-slate-100\/70:hover,
    html[data-theme="midnight"] .hover\:bg-slate-50:hover,
    html[data-theme="midnight"] .hover\:bg-slate-50\/80:hover,
    html[data-theme="midnight"] .hover\:bg-slate-50\/90:hover,
    html[data-theme="midnight"] .hover\:bg-slate-100\/70:hover {
      background-color: var(--bg-surface-hover) !important;
    }

    html[data-theme="black"] .hover\:bg-slate-200:hover,
    html[data-theme="midnight"] .hover\:bg-slate-200:hover {
      background-color: #272732 !important;
    }

    /* Subtle Tint Accents in Black/Midnight Mode */
    html[data-theme="black"] .bg-indigo-50,
    html[data-theme="black"] .bg-indigo-50\/70,
    html[data-theme="black"] .bg-indigo-50\/80,
    html[data-theme="midnight"] .bg-indigo-50,
    html[data-theme="midnight"] .bg-indigo-50\/70,
    html[data-theme="midnight"] .bg-indigo-50\/80 {
      background-color: rgba(99, 102, 241, 0.14) !important;
    }

    html[data-theme="black"] .text-indigo-700,
    html[data-theme="black"] .text-indigo-800,
    html[data-theme="black"] .text-indigo-900,
    html[data-theme="black"] .text-indigo-950,
    html[data-theme="midnight"] .text-indigo-700,
    html[data-theme="midnight"] .text-indigo-800,
    html[data-theme="midnight"] .text-indigo-900,
    html[data-theme="midnight"] .text-indigo-950 {
      color: #a5b4fc !important;
    }

    html[data-theme="black"] .border-indigo-200,
    html[data-theme="midnight"] .border-indigo-200 {
      border-color: rgba(99, 102, 241, 0.3) !important;
    }

    html[data-theme="black"] .bg-amber-50,
    html[data-theme="black"] .bg-amber-50\/40,
    html[data-theme="black"] .bg-amber-50\/60,
    html[data-theme="midnight"] .bg-amber-50,
    html[data-theme="midnight"] .bg-amber-50\/40,
    html[data-theme="midnight"] .bg-amber-50\/60 {
      background-color: rgba(245, 158, 11, 0.1) !important;
    }

    html[data-theme="black"] .text-amber-800,
    html[data-theme="black"] .text-amber-900,
    html[data-theme="midnight"] .text-amber-800,
    html[data-theme="midnight"] .text-amber-900 {
      color: #fcd34d !important;
    }

    html[data-theme="black"] .border-amber-200,
    html[data-theme="black"] .border-amber-300,
    html[data-theme="midnight"] .border-amber-200,
    html[data-theme="midnight"] .border-amber-300 {
      border-color: rgba(245, 158, 11, 0.3) !important;
    }

    html[data-theme="black"] .bg-rose-50,
    html[data-theme="midnight"] .bg-rose-50 {
      background-color: rgba(244, 63, 94, 0.12) !important;
    }

    html[data-theme="black"] .text-rose-700,
    html[data-theme="midnight"] .text-rose-700 {
      color: #fda4af !important;
    }

    html[data-theme="black"] .border-rose-200,
    html[data-theme="midnight"] .border-rose-200 {
      border-color: rgba(244, 63, 94, 0.3) !important;
    }

    html[data-theme="black"] .card-corner-glow,
    html[data-theme="midnight"] .card-corner-glow {
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 70%) !important;
    }

    /* Custom scrollbars and animations */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: var(--scroll-track);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--scroll-thumb);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--scroll-thumb-hover);
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      opacity: 1;
    }
    .row-highlight-anim {
      animation: pulseHighlight 1.2s ease-out;
    }
    @keyframes pulseHighlight {
      0% { background-color: rgba(99, 102, 241, 0.28); }
      100% { background-color: transparent; }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-slate-50 text-slate-800 selection:bg-indigo-500/30 selection:text-indigo-200 transition-colors duration-200" data-locale="en">

  <!-- Top Navigation & Class / Profile Tabs Bar -->
  <header class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <!-- Brand + Primary Navigation Switcher -->
      <div class="flex flex-wrap items-center justify-between py-3 gap-3 border-b border-slate-100">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 via-indigo-600 to-violet-700 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 ring-1 ring-white/15">
            <i class="fa-solid fa-graduation-cap text-lg"></i>
          </div>
          <div>
            <div class="flex items-center gap-2">
              <h1 id="brandTitleText" class="text-lg font-bold tracking-tight text-slate-900">GradeCraft</h1>
              <span id="brandBadgeText" class="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-700 border border-indigo-200">Calculator & Forecaster</span>
            </div>
            <p id="brandSubtitleText" class="text-xs text-slate-500">Multi-class weighted gradebook, bucket analyzer & what-if simulator</p>
          </div>
        </div>

        <!-- Top-Right Navigation Pills: Gradebook vs Profile & Settings -->
        <div class="flex items-center gap-2">
          <button id="btnNavGradebook" type="button" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold transition">
            <i class="fa-solid fa-table-columns"></i>
            <span id="navGradebookLabel">Gradebook</span>
          </button>
          <button id="btnNavProfile" type="button" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-xl text-xs font-semibold transition">
            <div class="w-5 h-5 rounded-full bg-indigo-600 text-white flex items-center justify-center text-[10px] font-bold">GC</div>
            <span id="navProfileLabel">Profile & Settings</span>
          </button>
        </div>
      </div>

      <!-- Class Tabs Bar (Visible when in Gradebook view) -->
      <div id="classTabsSubheader" class="flex items-center justify-between gap-2 pt-2.5 pb-0 overflow-x-auto">
        <div id="classTabsContainer" class="flex items-center gap-1.5 min-w-0">
          <!-- Dynamically populated class tabs -->
        </div>

        <button id="btnAddClass" type="button" class="shrink-0 mb-2 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm shadow-indigo-500/20 transition">
          <i class="fa-solid fa-plus"></i>
          <span id="btnAddClassLabel">Add Class</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace (Switches cleanly between Gradebook View and Profile & Settings Page) -->
  <main id="mainWorkspaceContainer" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
    <!-- Dynamically populated -->
  </main>

  <!-- Footer -->
  <footer class="max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 text-center text-xs text-slate-400 border-t border-slate-200/70 mt-8">
    <p id="footerNoticeText">GradeCraft — All class configurations, assignment entries, theme preferences, and grade forecasts are saved automatically in your browser.</p>
  </footer>

  <!-- Custom Confirmation Modal (No alert/confirm used) -->
  <div id="confirmModalBackdrop" class="fixed inset-0 z-50 bg-black/75 backdrop-blur-xs hidden items-center justify-center p-4">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-md w-full p-6 space-y-4">
      <div class="flex items-start gap-3">
        <div class="w-10 h-10 rounded-xl bg-rose-500/15 text-rose-500 border border-rose-500/30 flex items-center justify-center shrink-0">
          <i class="fa-solid fa-triangle-exclamation text-lg"></i>
        </div>
        <div>
          <h3 id="confirmModalTitle" class="text-base font-bold text-slate-900">Confirm Action</h3>
          <p id="confirmModalMessage" class="text-xs text-slate-600 mt-1 leading-relaxed">Are you sure you want to proceed?</p>
        </div>
      </div>
      <div class="flex items-center justify-end gap-2 pt-2">
        <button id="confirmModalCancelBtn" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition">
          Cancel
        </button>
        <button id="confirmModalAcceptBtn" type="button" class="px-4 py-2 rounded-xl text-xs font-semibold bg-rose-600 hover:bg-rose-500 text-white shadow-sm transition">
          Confirm
        </button>
      </div>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Application JavaScript -->
  <script>
    /*************************************************************************
     * 1. I18N CASCADE ARCHITECTURE & PRESETS
     * English strings serve as the base fallback cascade for any selected locale.
     *************************************************************************/
    const STORAGE_KEY = 'gradecraft_state_v1';

    const SUPPORTED_LOCALES = [
      { code: 'en', label: 'English (US) — en', region: 'United States' },
      { code: 'es', label: 'Español — es', region: 'España / Latinoamérica' },
      { code: 'uk', label: 'Українська — uk', region: 'Україна' },
      { code: 'fr', label: 'Français — fr', region: 'France / Canada' },
      { code: 'de', label: 'Deutsch — de', region: 'Deutschland' },
      { code: 'zh', label: '中文 — zh', region: '简体中文' },
      { code: 'ja', label: '日本語 — ja', region: '日本' },
      { code: 'pt', label: 'Português — pt', region: 'Brasil / Portugal' }
    ];

    /**
     * Localization Cascade Dictionary:
     * Non-English locales inherit from `translations.en` via `t(key)` cascade fallback.
     * English strings remain untranslated as requested, ready for future translation packs.
     */
    const translations = {
      en: {
        brandTitle: 'GradeCraft',
        brandBadge: 'Calculator & Forecaster',
        brandSubtitle: 'Multi-class weighted gradebook, bucket analyzer & what-if simulator',
        navGradebook: 'Gradebook',
        navProfile: 'Profile & Settings',
        addClass: 'Add Class',
        footerNotice: 'GradeCraft — All class configurations, assignment entries, theme preferences, and grade forecasts are saved automatically in your browser.'
      },
      es: {},
      uk: {},
      fr: {},
      de: {},
      zh: {},
      ja: {},
      pt: {}
    };

    function t(key) {
      const lang = appState?.locale || 'en';
      const activeDict = translations[lang] || {};
      return activeDict[key] ?? translations.en[key] ?? key;
    }

    const BUCKET_PRESETS = {
      standard_plus_minus: [
        { id: 'b_ap', letter: 'A+', min: 97 },
        { id: 'b_a',  letter: 'A',  min: 93 },
        { id: 'b_am', letter: 'A-', min: 90 },
        { id: 'b_bp', letter: 'B+', min: 87 },
        { id: 'b_b',  letter: 'B',  min: 83 },
        { id: 'b_bm', letter: 'B-', min: 80 },
        { id: 'b_cp', letter: 'C+', min: 77 },
        { id: 'b_c',  letter: 'C',  min: 73 },
        { id: 'b_cm', letter: 'C-', min: 70 },
        { id: 'b_d',  letter: 'D',  min: 60 },
        { id: 'b_f',  letter: 'F',  min: 0 }
      ],
      straight_letter: [
        { id: 'b_a', letter: 'A', min: 90 },
        { id: 'b_b', letter: 'B', min: 80 },
        { id: 'b_c', letter: 'C', min: 70 },
        { id: 'b_d', letter: 'D', min: 60 },
        { id: 'b_f', letter: 'F', min: 0 }
      ],
      generous_curve: [
        { id: 'b_ap', letter: 'A+', min: 95 },
        { id: 'b_a',  letter: 'A',  min: 88 },
        { id: 'b_am', letter: 'A-', min: 84 },
        { id: 'b_bp', letter: 'B+', min: 79 },
        { id: 'b_b',  letter: 'B',  min: 74 },
        { id: 'b_bm', letter: 'B-', min: 70 },
        { id: 'b_cp', letter: 'C+', min: 65 },
        { id: 'b_c',  letter: 'C',  min: 60 },
        { id: 'b_d',  letter: 'D',  min: 50 },
        { id: 'b_f',  letter: 'F',  min: 0 }
      ]
    };

    function createDefaultState() {
      return {
        theme: 'black', // Default: OLED True Black theme
        locale: 'en',
        activeView: 'gradebook', // 'gradebook' | 'profile'
        activeClassId: 'cls_cs61a',
        viewMode: 'grouped', // 'grouped' | 'flat'
        configExpanded: true,
        userProfile: {
          displayName: 'Student Workspace',
          email: 'local.browser@gradecraft.app',
          authStatus: 'guest_local'
        },
        classes: [
          {
            id: 'cls_cs61a',
            name: 'CS 61A: Structure of Computer Programs',
            term: 'Fall 2026',
            calculationMode: 'normalized',
            targetLetter: 'A',
            groups: [
              { id: 'grp_hw', name: 'Homework', weight: 15 },
              { id: 'grp_proj', name: 'Projects', weight: 30 },
              { id: 'grp_mt', name: 'Midterm Exams', weight: 25 },
              { id: 'grp_final', name: 'Final Exam', weight: 30 }
            ],
            buckets: JSON.parse(JSON.stringify(BUCKET_PRESETS.standard_plus_minus)),
            assignments: [
              { id: 'a_1', name: 'HW 01: Functions & Control', groupId: 'grp_hw', earned: 20, available: 20, isForecast: false, whatIfEarned: null },
              { id: 'a_2', name: 'HW 02: Higher-Order Functions', groupId: 'grp_hw', earned: 19, available: 20, isForecast: false, whatIfEarned: null },

    function loadState() {

        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createDefaultState();
        const parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.classes) || parsed.classes.length === 0) {

    /*************************************************************************
     * 3. CORE GRADE CALCULATION ENGINE
     *************************************************************************/
    function getSortedBuckets(cls) {
      return [...(cls.buckets || [])].sort((a, b) => Number(b.min) - Number(a.min));
    }

    function resolveGradeBucket(cls, percentage) {
      const sorted = getSortedBuckets(cls);
      if (sorted.length === 0 || percentage === null || isNaN(percentage)) {
        return { current: null, nextHigher: null, nextLower: null };
      }

      const epsPct = percentage + 1e-9;
      let idx = sorted.findIndex(b => epsPct >= Number(b.min));
      if (idx === -1) {
        idx = sorted.length - 1;
      }

      const current = sorted[idx];
      const nextHigher = idx > 0 ? sorted[idx - 1] : null;
      const nextLower = idx < sorted.length - 1 ? sorted[idx + 1] : null;

      return { current, nextHigher, nextLower };
    }

    function computeClassGrades(cls) {
      const groupStats = {};
      let totalConfiguredWeight = 0;

      cls.groups.forEach(g => {
        const w = Math.max(0, Number(g.weight) || 0);
        totalConfiguredWeight += w;
        groupStats[g.id] = {
          id: g.id,
          name: g.name,
          weight: w,
          actualEarned: 0,
          actualAvailable: 0,
          actualCount: 0,
          actualPct: null,
          forecastEarned: 0,
          forecastAvailable: 0,
          forecastCount: 0,
          forecastPct: null
        };
      });

      let activeForecastEntryCount = 0;

      cls.assignments.forEach(a => {
        const gStat = groupStats[a.groupId];
        if (!gStat) return;

        const avail = Math.max(0, Number(a.available) || 0);
        const earned = Number(a.earned) || 0;
        const hasWhatIf = a.whatIfEarned !== null && a.whatIfEarned !== '' && !isNaN(Number(a.whatIfEarned));
        const effectiveForecastEarned = hasWhatIf ? Number(a.whatIfEarned) : earned;

        if (a.isForecast || hasWhatIf) {
          activeForecastEntryCount++;
        }

        if (!a.isForecast && avail > 0) {
          gStat.actualEarned += earned;
          gStat.actualAvailable += avail;
          gStat.actualCount += 1;
        }

        if (avail > 0) {
          gStat.forecastEarned += effectiveForecastEarned;
          gStat.forecastAvailable += avail;
          gStat.forecastCount += 1;
        }
      });

      let actualWeightedSum = 0;
      let actualGradedWeight = 0;
      let totalActualEarnedPts = 0;
      let totalActualAvailPts = 0;

      let forecastWeightedSum = 0;
      let forecastGradedWeight = 0;
      let totalForecastEarnedPts = 0;
      let totalForecastAvailPts = 0;

      cls.groups.forEach(g => {
        const st = groupStats[g.id];
        totalActualEarnedPts += st.actualEarned;
        totalActualAvailPts += st.actualAvailable;
        totalForecastEarnedPts += st.forecastEarned;
        totalForecastAvailPts += st.forecastAvailable;

        if (st.actualAvailable > 0) {
          st.actualPct = (st.actualEarned / st.actualAvailable) * 100;
          actualWeightedSum += st.actualPct * (st.weight / 100);
          actualGradedWeight += st.weight;
        }

        if (st.forecastAvailable > 0) {
          st.forecastPct = (st.forecastEarned / st.forecastAvailable) * 100;
          forecastWeightedSum += st.forecastPct * (st.weight / 100);
          forecastGradedWeight += st.weight;
        }
      });

      const isNormalized = cls.calculationMode !== 'absolute';

      let overallActualPct = null;
      if (actualGradedWeight > 0) {
        overallActualPct = isNormalized
          ? (actualWeightedSum / (actualGradedWeight / 100))
          : actualWeightedSum;
      }

      let overallForecastPct = null;
      if (forecastGradedWeight > 0) {
        overallForecastPct = isNormalized
          ? (forecastWeightedSum / (forecastGradedWeight / 100))
          : forecastWeightedSum;
      }

      const actualBucketInfo = resolveGradeBucket(cls, overallActualPct);
      const forecastBucketInfo = resolveGradeBucket(cls, overallForecastPct);

      return {
        groupStats,
        totalConfiguredWeight,
        actualGradedWeight,
        forecastGradedWeight,
        actualWeightedSum,
        forecastWeightedSum,
        totalActualEarnedPts,
        totalActualAvailPts,
        totalForecastEarnedPts,
        totalForecastAvailPts,
        overallActualPct,
        overallForecastPct,
        actualBucketInfo,
        forecastBucketInfo,
        activeForecastEntryCount
      };
    }

    function formatNum(n, decimals = 2) {
      if (n === null || n === undefined || isNaN(n)) return '--';
      return Number(n).toFixed(decimals);
    }

    function formatCleanPts(n) {
      if (n === null || n === undefined || isNaN(n)) return '0';
      const num = Number(n);
      return Number.isInteger(num) ? num.toString() : parseFloat(num.toFixed(2)).toString();
    }

    function getLetterBadgeStyle(letter) {
      const dark = isDarkTheme();
      if (!letter) {
        return dark
          ? 'bg-zinc-900 text-zinc-500 border-zinc-800'
          : 'bg-slate-100 text-slate-500 border-slate-200';
      }
      const u = letter.toUpperCase();
      if (u.startsWith('A')) {
        return dark
          ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/35 shadow-[0_0_20px_-4px_rgba(16,185,129,0.3)]'
          : 'bg-emerald-50 text-emerald-700 border-emerald-200';
      }
      if (u.startsWith('B')) {
        return dark
          ? 'bg-indigo-500/15 text-indigo-300 border-indigo-500/35 shadow-[0_0_20px_-4px_rgba(99,102,241,0.3)]'
          : 'bg-indigo-50 text-indigo-700 border-indigo-200';
      }
      if (u.startsWith('C')) {
        return dark
          ? 'bg-amber-500/15 text-amber-300 border-amber-500/35 shadow-[0_0_20px_-4px_rgba(245,158,11,0.25)]'
          : 'bg-amber-50 text-amber-700 border-amber-200';
      }
      if (u.startsWith('D')) {
        return dark
          ? 'bg-orange-500/15 text-orange-300 border-orange-500/35'
          : 'bg-orange-50 text-orange-700 border-orange-200';
      }
      return dark
        ? 'bg-rose-500/15 text-rose-300 border-rose-500/35'
        : 'bg-rose-50 text-rose-700 border-rose-200';
    }

    function getScorePillColor(pct) {
      const dark = isDarkTheme();
      if (pct === null || isNaN(pct)) {
        return dark ? 'bg-zinc-800 text-zinc-400 border border-zinc-700' : 'bg-slate-100 text-slate-600';
      }
      if (pct >= 90) {
        return dark
          ? 'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30'
          : 'bg-emerald-100 text-emerald-800';
      }
      if (pct >= 80) {
        return dark
          ? 'bg-indigo-500/15 text-indigo-300 border border-indigo-500/30'
          : 'bg-indigo-100 text-indigo-800';
      }
      if (pct >= 70) {
        return dark
          ? 'bg-amber-500/15 text-amber-300 border border-amber-500/30'
          : 'bg-amber-100 text-amber-800';
      }
      return dark
        ? 'bg-rose-500/15 text-rose-300 border border-rose-500/30'
        : 'bg-rose-100 text-rose-800';
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const el = document.createElement('div');
      const colorMap = {
        info: 'bg-zinc-900 text-zinc-100 border-zinc-700 shadow-black/60',
        success: 'bg-emerald-950/95 text-emerald-200 border-emerald-500/40 shadow-black/60',
        warning: 'bg-amber-950/95 text-amber-200 border-amber-500/40 shadow-black/60'
      };
      el.className = `pointer-events-auto flex items-center gap-2 px-4 py-2.5 rounded-xl border shadow-xl text-xs font-medium transition-all duration-300 ${colorMap[type] || colorMap.info}`;
      el.innerHTML = `<i class="fa-solid fa-circle-check text-indigo-400"></i><span>${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(6px)';
        setTimeout(() => el.remove(), 250);
      }, 2600);
    }

    let pendingConfirmCallback = null;
    function openConfirmModal(title, message, onConfirm) {
      const titleEl = document.getElementById('confirmModalTitle');
      const msgEl = document.getElementById('confirmModalMessage');
      const backdrop = document.getElementById('confirmModalBackdrop');
      if (!titleEl || !msgEl || !backdrop) return;
      titleEl.textContent = title;
      msgEl.textContent = message;
      pendingConfirmCallback = onConfirm;
      backdrop.classList.remove('hidden');
      backdrop.classList.add('flex');
    }

    function closeConfirmModal() {
      const backdrop = document.getElementById('confirmModalBackdrop');
      if (!backdrop) return;
      backdrop.classList.add('hidden');
      backdrop.classList.remove('flex');
      pendingConfirmCallback = null;
    }

    function exportBackupJson() {
      const dataStr = JSON.stringify(appState, null, 2);
      const blob = new Blob([dataStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `gradecraft_backup_${new Date().toISOString().slice(0, 10)}.json`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      showToast('Exported gradebook JSON backup', 'success');
    }

    function importBackupJsonFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          if (!parsed || !Array.isArray(parsed.classes) || parsed.classes.length === 0) {
            showToast('Invalid JSON format: missing classes array.', 'warning');
            return;
          }
          if (!parsed.theme) parsed.theme = appState.theme || 'black';
          if (!parsed.locale) parsed.locale = appState.locale || 'en';
          if (!parsed.activeView) parsed.activeView = 'gradebook';
          appState = parsed;
          filterGroupId = 'ALL';
          saveState();
          renderAll();
          showToast('Imported classes successfully!', 'success');
        } catch (err) {
          showToast('Could not parse JSON file.', 'warning');
        }
      };
      reader.readAsText(file);
    }

      });

        applyLocaleCascade(e.target.value);
        saveState();
        renderProfilePage();

      document.getElementById('btnProfileExportJson')?.addEventListener('click', exportBackupJson);

                <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">
                  <i class="fa-solid fa-list-check text-indigo-500"></i>
                  <span>Class Assignments & Forecast Entries</span>

                <p class="text-xs text-slate-500 mt-0.5">Sorted by <strong>Assignment Group</strong>. Edit points, switch assignment groups, or enter <strong>What-If / Forecast</strong> scores inline.</p>

              <div class="flex flex-wrap items-center gap-2">
                <div class="inline-flex items-center bg-slate-200/70 p-1 rounded-xl text-xs font-semibold border border-slate-200">
                  <button id="viewGroupedBtn" type="button" class="px-2.5 py-1 rounded-lg transition bg-white text-slate-900 shadow-sm">
                    <i class="fa-solid fa-folder-tree mr-1 text-indigo-500"></i>Grouped Sections
                  </button>
                  <button id="viewFlatSortedBtn" type="button" class="px-2.5 py-1 rounded-lg transition text-slate-600 hover:text-slate-900">
                    <i class="fa-solid fa-table-list mr-1"></i>Unified Table

                </div>

                <select id="filterGroupSelect" class="text-xs font-medium bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-slate-700 focus:outline-none focus:border-indigo-600">
                  <option value="ALL">All Assignment Groups</option>
                </select>

                <select id="filterModeSelect" class="text-xs font-medium bg-white border border-slate-300 rounded-xl px-3 py-1.5 text-slate-700 focus:outline-none focus:border-indigo-600">
                  <option value="ALL">All Entries (Actual + Forecast)</option>
                  <option value="ACTUAL">Actual Graded Only</option>
                  <option value="FORECAST">Forecast / What-If Only</option>
                </select>
              </div>
            </div>

            <!-- Quick Add Assignment Form Bar -->
            <form id="quickAddAssignmentForm" class="bg-white p-3.5 rounded-xl border border-indigo-100 shadow-sm grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-end">
              <div class="sm:col-span-3">
                <label for="newAssignName" class="block text-[11px] font-semibold text-slate-600 mb-1">Assignment Name</label>
                <input id="newAssignName" type="text" required placeholder="e.g., Homework 5 or Midterm 2" class="w-full text-xs rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:border-indigo-600" />
              </div>

              <div class="sm:col-span-3">
                <label for="newAssignGroup" class="block text-[11px] font-semibold text-slate-600 mb-1">Assignment Group</label>
                <select id="newAssignGroup" class="w-full text-xs rounded-lg border border-slate-300 px-2.5 py-2 bg-white focus:outline-none focus:border-indigo-600"></select>
              </div>

              <div class="sm:col-span-2">
                <label for="newAssignEarned" class="block text-[11px] font-semibold text-slate-600 mb-1">Points Earned</label>
                <input id="newAssignEarned" type="number" step="any" min="0" required placeholder="e.g., 46" class="w-full text-xs font-mono rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:border-indigo-600" />
              </div>

              <div class="sm:col-span-2">
                <label for="newAssignAvailable" class="block text-[11px] font-semibold text-slate-600 mb-1">Available Points</label>
                <input id="newAssignAvailable" type="number" step="any" min="0.01" required placeholder="e.g., 50" class="w-full text-xs font-mono rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:border-indigo-600" />
              </div>

              <div class="sm:col-span-2 flex items-center gap-1.5">
                <button type="submit" class="flex-1 inline-flex items-center justify-center gap-1.5 px-3 py-2 rounded-lg text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-sm transition">
                  <i class="fa-solid fa-plus"></i>
                  <span>Add Actual</span>
                </button>
                <button type="button" id="btnQuickAddForecast" class="inline-flex items-center justify-center gap-1 px-2.5 py-2 rounded-lg text-xs font-semibold bg-amber-500 hover:bg-amber-400 text-slate-950 shadow-sm transition" title="Add as a hypothetical Forecast assignment">
                  <i class="fa-solid fa-wand-magic-sparkles"></i>
                  <span>Forecast</span>
                </button>
              </div>
            </form>
          </div>

          <div id="assignmentsGradebookContainer" class="p-4 sm:p-5 space-y-6"></div>
        </section>
      `;

      bindGradebookEvents();
      renderConfigPanels();
      syncGroupDropdowns();
      renderGradebook();
      updateSummaryAndComputedViews();
    }

    function renderConfigPanels() {

      if (!cls) return;

      // 1. Assignment Groups Table
      const groupsTbody = document.getElementById('assignmentGroupsTableBody');
      if (groupsTbody) {
        groupsTbody.innerHTML = cls.groups.map(g => `
          <tr class="hover:bg-slate-50/80 transition">
            <td class="py-2.5 pl-2 pr-2">
              <input
                type="text"
                value="${escapeHtml(g.name)}"
                data-group-id="${escapeHtml(g.id)}"
                data-group-field="name"
                class="w-full text-xs font-semibold text-slate-800 bg-transparent border border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-white rounded-lg px-2 py-1 focus:outline-none transition"
              />
            </td>
            <td class="py-2.5 text-right">
              <div class="inline-flex items-center justify-end gap-1">

                  type="number"

                  max="100"
                  value="${escapeHtml(g.weight)}"
                  data-group-id="${escapeHtml(g.id)}"
                  data-group-field="weight"

                <span class="text-xs text-slate-400 font-mono">%</span>

            </td>

            <td id="groupForecastCell_${escapeHtml(g.id)}" class="py-2.5 text-right font-mono text-xs font-semibold text-indigo-500">--%</td>
            <td class="py-2.5 text-center">
              <button
                type="button"
                data-action="delete-group"

              </button>
            </td>

        `).join('');

      const bucketsTbody = document.getElementById('gradeBucketsTableBody');

        const sortedBuckets = getSortedBuckets(cls);
        bucketsTbody.innerHTML = sortedBuckets.map((b, index) => {
          const upperBound = index === 0 ? '100%' : `< ${formatCleanPts(sortedBuckets[index - 1].min)}%`;
          return `
            <tr id="bucketRow_${escapeHtml(b.id)}" class="hover:bg-slate-50/80 transition">
              <td class="py-2 pl-2">
                <input

                  maxlength="5"
                  value="${escapeHtml(b.letter)}"
                  data-bucket-id="${escapeHtml(b.id)}"
                  data-bucket-field="letter"
                  class="w-16 text-xs font-bold uppercase text-center bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:border-indigo-600"
                />
              </td>
              <td class="py-2 text-right">
                <div class="inline-flex items-center justify-end gap-1">
                  <input
                    type="number"
                    step="any"
                    min="0"
                    max="100"
                    value="${escapeHtml(b.min)}"
                    data-bucket-id="${escapeHtml(b.id)}"
                    data-bucket-field="min"
                    class="w-20 text-right text-xs font-mono font-semibold bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:border-indigo-600"
                  />
                  <span class="text-[11px] text-slate-400 font-mono">%</span>
                </div>
              </td>
              <td class="py-2 text-center font-mono text-[11px] text-slate-500">
                ${formatCleanPts(b.min)}% – ${upperBound}

              <td id="bucketStatusCell_${escapeHtml(b.id)}" class="py-2 text-right pr-2"></td>

                <button
                  type="button"
                  data-action="delete-bucket"
                  data-bucket-id="${escapeHtml(b.id)}"
                  class="w-6 h-6 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-500/10 transition"

                  <i class="fa-solid fa-xmark text-xs"></i>
                </button>
              </td>
            </tr>
          `;
        }).join('');
      }
    }

    function syncGroupDropdowns() {
      const cls = getActiveClass();
      if (!cls) return;

      const newAssignGroup = document.getElementById('newAssignGroup');
      const filterGroupSelect = document.getElementById('filterGroupSelect');

      const optionsHtml = cls.groups.map(g =>
        `<option value="${escapeHtml(g.id)}">${escapeHtml(g.name)} (${formatCleanPts(g.weight)}%)</option>`
      ).join('');

      if (newAssignGroup) {
        const prev = newAssignGroup.value;
        newAssignGroup.innerHTML = optionsHtml;
        if (prev && cls.groups.some(g => g.id === prev)) {
          newAssignGroup.value = prev;
        }
      }

      if (filterGroupSelect) {
        filterGroupSelect.innerHTML = `<option value="ALL">All Assignment Groups</option>` + optionsHtml;
        filterGroupSelect.value = filterGroupId;
      }
    }

    function renderAssignmentRowHtml(cls, a, showGroupColumn = false) {
      const pct = a.available > 0 ? (a.earned / a.available) * 100 : 0;
      const hasWhatIf = a.whatIfEarned !== null && a.whatIfEarned !== '' && !isNaN(Number(a.whatIfEarned));
      const effectivePct = a.available > 0 ? ((hasWhatIf ? Number(a.whatIfEarned) : a.earned) / a.available) * 100 : 0;
      const isHighlight = a.id === lastMovedAssignmentId;
      if (isHighlight) lastMovedAssignmentId = null;

      const groupOptionsHtml = cls.groups.map(g =>
        `<option value="${escapeHtml(g.id)}" ${g.id === a.groupId ? 'selected' : ''}>${escapeHtml(g.name)}</option>`
      ).join('');

      return `
        <tr id="assignRow_${escapeHtml(a.id)}" class="hover:bg-slate-50/90 transition ${a.isForecast ? 'bg-amber-50/40' : ''} ${isHighlight ? 'row-highlight-anim' : ''}">
          <td class="py-2.5 pl-3 pr-2">
            <div class="flex items-center gap-2">
              <button
                type="button"
                data-action="toggle-assign-forecast"
                data-assign-id="${escapeHtml(a.id)}"
                class="shrink-0 px-2 py-0.5 rounded-md text-[10px] font-bold uppercase tracking-wide border transition ${
                  a.isForecast
                    ? 'bg-amber-500/20 text-amber-400 border-amber-500/40'
                    : 'bg-slate-100 text-slate-600 border-slate-200 hover:border-indigo-400'
                }"
                title="Toggle between Actual graded entry and Forecast hypothetical entry"
              >
                ${a.isForecast ? 'Forecast' : 'Actual'}
              </button>
              <input
                type="text"
                value="${escapeHtml(a.name)}"
                data-assign-id="${escapeHtml(a.id)}"
                data-assign-field="name"
                class="w-full min-w-[140px] text-xs font-semibold text-slate-800 bg-transparent border border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-white rounded-lg px-2 py-1 focus:outline-none transition"
              />
            </div>
          </td>
          ${showGroupColumn ? `
            <td class="py-2.5 px-2">
              <select
                data-assign-id="${escapeHtml(a.id)}"
                data-assign-field="groupId"
                class="text-xs font-medium bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:border-indigo-600"
              >
                ${groupOptionsHtml}
              </select>
            </td>
          ` : `
            <td class="py-2.5 px-2 w-40">
              <select
                data-assign-id="${escapeHtml(a.id)}"
                data-assign-field="groupId"
                class="w-full text-xs font-medium bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:border-indigo-600"
                title="Change Assignment Group (automatically re-sorts)"

                ${groupOptionsHtml}

            </td>

          <td class="py-2.5 px-2 text-right">
            <input
              type="number"
              step="any"
              min="0"
              value="${escapeHtml(a.earned)}"
              data-assign-id="${escapeHtml(a.id)}"
              data-assign-field="earned"
              class="w-20 text-right text-xs font-mono font-semibold bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:border-indigo-600"
            />
          </td>
          <td class="py-2.5 px-2 text-right">
            <input
              type="number"
              step="any"
              min="0.01"
              value="${escapeHtml(a.available)}"
              data-assign-id="${escapeHtml(a.id)}"
              data-assign-field="available"
              class="w-20 text-right text-xs font-mono font-semibold bg-slate-50 border border-slate-300 rounded-lg px-2 py-1 focus:outline-none focus:border-indigo-600"
            />
          </td>
          <td class="py-2.5 px-2 text-right">
            <span id="assignPctPill_${escapeHtml(a.id)}" class="inline-block px-2 py-0.5 rounded-md font-mono text-[11px] font-bold ${getScorePillColor(pct)}">
              ${formatNum(pct, 1)}%

          </td>
          <td class="py-2.5 px-2 text-right">
            <div class="inline-flex items-center justify-end gap-1">
              <input
                type="number"
                step="any"
                min="0"
                placeholder="${a.isForecast ? 'Hypothetical' : 'What-if...'}"
                value="${hasWhatIf ? escapeHtml(a.whatIfEarned) : ''}"
                data-assign-id="${escapeHtml(a.id)}"
                data-assign-field="whatIfEarned"

                title="Test a What-If score override without overwriting your actual score"
              />

                  type="button"
                  data-action="clear-whatif"
                  data-assign-id="${escapeHtml(a.id)}"

                  <i class="fa-solid fa-xmark text-xs"></i>

            <div id="assignEffPct_${escapeHtml(a.id)}" class="text-[10px] font-mono text-indigo-400 mt-0.5 ${hasWhatIf ? '' : 'hidden'}">

            <button
              type="button"
              data-action="duplicate-assign"
              data-assign-id="${escapeHtml(a.id)}"
              class="w-7 h-7 rounded-lg text-slate-400 hover:text-indigo-400 hover:bg-indigo-500/10 transition"
              title="Duplicate assignment"
            >
              <i class="fa-regular fa-copy text-xs"></i>
            </button>
            <button
              type="button"
              data-action="delete-assign"
              data-assign-id="${escapeHtml(a.id)}"
              class="w-7 h-7 rounded-lg text-slate-400 hover:text-rose-500 hover:bg-rose-500/10 transition"
